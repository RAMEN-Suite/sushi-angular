name: CI

on:
  push:
    branches: [main, 'renovate/**']
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  node-ci:
    name: CI
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/node-ci.yml@8e59a69a656e4c4fe915374a3e35ec6741a93716 # v0.2.0
    with:
      test-scripts: test:coverage test:tools
      coverage-summary: coverage/sushi/coverage-summary.json
      e2e-script: test:e2e
      package-script: package:check
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private

  supply-chain:
    name: CI
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/supply-chain.yml@8e59a69a656e4c4fe915374a3e35ec6741a93716 # v0.2.0
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private

  security:
    name: CI
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/security.yml@8e59a69a656e4c4fe915374a3e35ec6741a93716 # v0.2.0
    with:
      semgrep-configs: p/security-audit p/secrets p/typescript p/javascript
      codeql-config-file: ./.github/codeql/codeql-config.yml
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
