name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # required to lint the commit range
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Library tests
        run: npm run test:coverage
      - name: Tool tests
        run: npm run test:tools
      - name: Write coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            {
              echo "## 🧪 Coverage"
              echo ""
              echo "⚠️ \`coverage/coverage-summary.json\` was not found — check the test step's logs above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 🧪 Coverage"
            echo ""
            echo "| Metric | Covered | Total | Percent |"
            echo "|---|---|---|---|"
            jq -r '
              .total
              | to_entries[]
              | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct)% |"
            ' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build, lint and smoke test the package
        run: npm run package:check

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Lint lockfile
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https
      - name: Install dependencies
        run: npm ci
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Scan licenses with trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: json
          output: trivy-licenses.json
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' # inventory only, the gate is the step below
          exit-code: '0'
      - name: Write license summary
        if: always()
        run: |
          if [ ! -f trivy-licenses.json ]; then
            {
              echo "## 📜 License Report"
              echo ""
              echo "⚠️ \`trivy-licenses.json\` was not found — check the scan step's logs above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(jq '[.Results[]?.Licenses[]?] | length' trivy-licenses.json)
          {
            echo "## 📜 License Report"
            echo ""

            if [ "$total" -eq 0 ]; then
              echo "⚠️ No licenses were detected. Either the scan found no packages or the report format changed — do not read this as a pass."
            else
              echo "**Licenses found: $total**"
              echo ""
              echo "| Severity | Category | License | Count |"
              echo "|---|---|---|---|"
              jq -r '
                [.Results[]?.Licenses[]?]
                | group_by([.Severity, .Category, .Name])
                | map({severity: .[0].Severity, category: .[0].Category, license: .[0].Name, count: length})
                | sort_by(-.count)
                | .[]
                | "| \(.severity) | \(.category) | \(.license) | \(.count) |"
              ' trivy-licenses.json
              echo ""

              echo "<details>"
              echo "<summary>Show all packages</summary>"
              echo ""
              echo "| Severity | License | Package |"
              echo "|---|---|---|"
              jq -r '
                [.Results[]?.Licenses[]?]
                | sort_by(.Severity, .Name, .PkgName)
                | .[]
                | "| \(.Severity) | \(.Name) | \(.PkgName // .FilePath // "unknown") |"
              ' trivy-licenses.json
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check licenses # second scan so the gate is trivy's own exit code, not our jq
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-licenses
          path: trivy-licenses.json
          if-no-files-found: ignore
          retention-days: 30

  security:
    name: Vulnerability and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # required for gitleaks to scan the history
          persist-credentials: false
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: true
      - name: Upload trivy report to security tab
        if: always() && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
      - name: Run gitleaks (docker)
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.30.0 \
            git --redact --report-format sarif --report-path gitleaks.sarif .
      - name: Upload gitleaks report to security tab
        if: always() && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-results-${{ github.sha }}
          path: |
            trivy-results.sarif
            gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30
      - name: Write step summary from SARIF
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            {
              echo "## 🔍 Trivy Scan Summary"
              echo ""
              echo "⚠️ \`trivy-results.sarif\` was not found — the scan step may have failed before producing output. Check the scan step's logs above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(jq '[.runs[0].results[]] | length' trivy-results.sarif)
          {
            echo "## 🔍 Trivy Scan Summary"
            echo ""

            if [ "$total" -eq 0 ]; then
              echo "✅ No issues found."
            else
              echo "**Total findings: $total**"
              echo ""
              echo "| Severity | Count |"
              echo "|---|---|"
              jq -r '
                (.runs[0].tool.driver.rules // []) as $rules |
                .runs[0].results[] as $r |
                ($rules[] | select(.id == $r.ruleId) | (.properties.tags[] | select(IN("CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN")))) as $sev |
                $sev
              ' trivy-results.sarif | sort | uniq -c | sort -rn | while read -r count sev; do
                [ -z "$sev" ] && continue
                echo "| $sev | $count |"
              done
              echo ""

              echo "<details>"
              echo "<summary>Show all findings</summary>"
              echo ""
              echo "| Severity | Rule | File | Detail |"
              echo "|---|---|---|---|"
              jq -r '
                (.runs[0].tool.driver.rules // []) as $rules |
                .runs[0].results[] |
                . as $r |
                ($rules[] | select(.id == $r.ruleId) | (.properties.tags[] | select(IN("CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN")))) as $sev |
                [
                  $sev,
                  $r.ruleId,
                  ($r.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                  ($r.message.text // "" | gsub("\n"; " ") | .[0:90])
                ] | @tsv
              ' trivy-results.sarif | while IFS=$'\t' read -r sev rule file detail; do
                echo "| $sev | $rule | $file | $detail |"
              done
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    container:
      image: semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 # 1.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: |
          set -o pipefail
          semgrep scan \
          --config p/security-audit \
          --config p/secrets \
          --config p/typescript \
          --config p/javascript \
          --severity ERROR \
          --error \
          --sarif \
          --output semgrep.sarif
      - name: Print Semgrep results
        if: failure()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "=== Semgrep blocking findings ==="
            jq -r '
              .runs[].results[]
              | "\(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text)"
            ' semgrep.sarif
          else
            echo "No semgrep.sarif found"
          fi
      - name: Upload Semgrep results to Github Security tab
        if: always() && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: sast
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: '/language:javascript-typescript'
