name: Conventional commits

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/conventional-node.yml@be77eb7a0193fbefb76680b47f8da9c2092ef75f # v0.1.2
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
