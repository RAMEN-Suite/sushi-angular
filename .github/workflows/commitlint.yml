name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@8e59a69a656e4c4fe915374a3e35ec6741a93716 # v0.2.0
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
