name: Commitlint

on:
  push:

permissions: {}

concurrency:
  group: commitlint-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required to resolve the pushed commit range
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install tooling
        run: npm ci
      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          start="$BEFORE"

          # new branch or force push: fall back to whatever is not on main yet
          if ! git cat-file -e "${start}^{commit}" 2>/dev/null; then
            start="origin/main"
          fi

          if [ "$(git rev-parse "$start")" = "$AFTER" ]; then
            echo "No new commits to lint."
            exit 0
          fi

          npx commitlint --from "$start" --to "$AFTER" --verbose
