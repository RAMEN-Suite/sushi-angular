name: Conventional commits

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/conventional-node.yml@78c5151db08fc2fadaaa0ec6dd33cae3e2160822 # v0.1.1
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
