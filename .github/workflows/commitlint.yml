name: Commitlint

on:
  push:

permissions: {}

concurrency:
  group: commitlint-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # required to resolve the pushed commit range
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install tooling
        run: npm ci
      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          start="$BEFORE"

          # new branch or force push: fall back to whatever is not on main yet
          if ! git cat-file -e "${start}^{commit}" 2>/dev/null; then
            start="origin/main"
          fi

          if [ "$(git rev-parse "$start")" = "$AFTER" ]; then
            echo "No new commits to lint."
            exit 0
          fi

          npx commitlint --from "$start" --to "$AFTER" --verbose
