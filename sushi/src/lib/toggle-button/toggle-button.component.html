@if (controlTemplate(); as template) {
  <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="context()" />
} @else {
  <button
    suiButton
    type="button"
    class="sui-toggle-button"
    [severity]="severity()"
    [variant]="checked() ? null : (variant() ?? 'outlined')"
    [size]="size()"
    [shape]="shape()"
    [disabled]="disabled()"
    [loading]="loading()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-pressed]="checked()"
    (blur)="handleBlur()"
    (click)="handleToggle()"
  >
    @if (checked()) {
      <span class="inline-flex items-center justify-center gap-2 whitespace-nowrap">
        @if (onTemplate(); as template) {
          <ng-container [ngTemplateOutlet]="template" />
        } @else {
          {{ onLabel() }}
        }
      </span>
    } @else {
      <span class="inline-flex items-center justify-center gap-2 whitespace-nowrap">
        @if (offTemplate(); as template) {
          <ng-container [ngTemplateOutlet]="template" />
        } @else {
          {{ offLabel() }}
        }
      </span>
    }
  </button>
}
