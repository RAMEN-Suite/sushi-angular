<div
  class="input sui-form-control flex max-w-full items-center gap-2"
  [class.w-full]="fluid()"
  [class.input-xs]="size() === 'xs'"
  [class.input-sm]="size() === 'sm'"
  [class.input-lg]="size() === 'lg'"
  [class.input-xl]="size() === 'xl'"
  [class.input-error]="invalid()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-50]="disabled()"
>
  @if (prefix()) {
    <span class="shrink-0 text-base-content/60">{{ prefix() }}</span>
  }
  <input
    #inputElement
    class="min-w-0 grow text-right outline-none"
    type="text"
    inputmode="decimal"
    [value]="displayValue()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="value()"
    [attr.aria-invalid]="invalid() || null"
    role="spinbutton"
    (focus)="handleFocus()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    (keydown.arrowup)="adjust(1); $event.preventDefault()"
    (keydown.arrowdown)="adjust(-1); $event.preventDefault()"
  />
  @if (suffix()) {
    <span class="shrink-0 text-base-content/60">{{ suffix() }}</span>
  }
  @if (showButtons()) {
    <span class="flex shrink-0 gap-1">
      <button
        suiButton
        type="button"
        severity="neutral"
        variant="soft"
        size="xs"
        shape="square"
        [disabled]="disabled()"
        aria-label="Decrease"
        (click)="handleStep(-1)"
      >
        <svg lucideMinus class="size-3" aria-hidden="true"></svg>
      </button>
      <button
        suiButton
        type="button"
        severity="neutral"
        variant="soft"
        size="xs"
        shape="square"
        [disabled]="disabled()"
        aria-label="Increase"
        (click)="handleStep(1)"
      >
        <svg lucidePlus class="size-3" aria-hidden="true"></svg>
      </button>
    </span>
  }
</div>
