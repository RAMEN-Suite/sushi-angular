<ol
  #list
  role="list"
  cdkDropList
  class="sui-order-list__items"
  tabindex="-1"
  [attr.id]="id()"
  [attr.inert]="disabled() ? '' : null"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledby()"
  [attr.aria-describedby]="ariaDescribedby()"
  [attr.aria-invalid]="isInvalid() || null"
  [cdkDropListData]="value()"
  [cdkDropListDisabled]="disabled() || !reorderable() || !dragDrop()"
  (focusout)="handleFocusout($event)"
  (cdkDropListDropped)="handleDrop($event)"
>
  @for (item of value(); track item.value; let index = $index) {
    <li
      cdkDrag
      cdkDragLockAxis="y"
      class="sui-order-list__row"
      [cdkDragData]="item"
      [cdkDragDisabled]="!canReorder(item) || !dragDrop()"
      [cdkDragPreviewContainer]="host"
      [cdkDragStartDelay]="{ mouse: 0, touch: 150 }"
    >
      <button
        #handle
        cdkDragHandle
        class="sui-order-list__handle"
        type="button"
        [suiMenuTrigger]="movement"
        [disabled]="!canReorder(item)"
        [attr.aria-label]="text().reorder(item)"
        [attr.aria-describedby]="instructionsId"
        aria-keyshortcuts="Alt+ArrowUp Alt+ArrowDown Alt+Shift+ArrowUp Alt+Shift+ArrowDown Alt+Home Alt+End"
        [class.sui-order-list__handle--draggable]="canReorder(item) && dragDrop()"
        (keydown)="handleKeydown($event, item)"
      >
        <svg lucideGripVertical aria-hidden="true"></svg>
      </button>
      <div class="sui-order-list__content">
        @if (itemTemplate(); as template) {
          <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="itemContext(item, index)" />
        } @else {
          {{ item.label }}
        }
      </div>
      <sui-menu
        #movement
        popup
        size="sm"
        severity="neutral"
        [ariaLabel]="text().reorder(item)"
        [disabled]="!canReorder(item)"
        [items]="actions(item, index)"
        (itemSelected)="handleAction(item, $event)"
      />
    </li>
  } @empty {
    <li class="sui-order-list__empty">{{ text().empty }}</li>
  }
</ol>
<p class="sr-only" [id]="instructionsId">{{ text().instructions }}</p>
<span class="sr-only" role="status" aria-live="polite" aria-atomic="true">{{ announcement() }}</span>
