<div
  [suiMask]="maskShape()"
  [maskHalf]="maskHalf()"
  [class.bg-inherit]="!placeholder()"
  [class.text-inherit]="!placeholder()"
  [class.bg-neutral]="placeholder()"
  [class.text-neutral-content]="placeholder()"
  [class.w-8]="size() === 'xs'"
  [class.w-12]="size() === 'sm'"
  [class.w-16]="size() === 'md'"
  [class.w-20]="size() === 'lg'"
  [class.w-24]="size() === 'xl'"
  [class.rounded-none]="shape() === 'square'"
  [class.rounded-xl]="shape() === 'rounded'"
  [class.rounded-full]="shape() === 'circle'"
>
  <ng-content />
</div>
