@if (copyable()) {
  @if (copyButtonRef(); as template) {
    <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="copyButtonContext" />
  } @else {
    <button
      suiButton
      type="button"
      class="sui-code-control__copy-button"
      severity="neutral"
      variant="text"
      size="xs"
      (click)="handleCopy()"
    >
      <span class="sui-code-control__copy" [class.sui-code-control__copy--active]="isCopied()">
        <span class="sui-code-control__copy-default" [class.opacity-0]="isCopied()">
          @if (copyIconRef(); as template) {
            <ng-container [ngTemplateOutlet]="template" />
          } @else {
            <svg class="size-4" lucideCopy></svg>
          }
        </span>

        <span class="sui-code-control__copy-success">
          @if (copiedIconRef(); as template) {
            <ng-container [ngTemplateOutlet]="template" />
          } @else {
            <svg class="size-5" lucideCheck></svg>
          }
        </span>
      </span>
    </button>
  }
}

<ng-content />
