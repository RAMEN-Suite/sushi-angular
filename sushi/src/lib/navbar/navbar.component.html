<nav
  class="navbar sui-navbar"
  [class.min-h-0]="orientation() === 'vertical'"
  [class.min-h-12]="orientation() !== 'vertical' && size() === 'sm'"
  [class.min-h-16]="orientation() !== 'vertical' && size() === 'md'"
  [class.rounded-box]="surface() === 'bordered'"
  [class.border]="surface() === 'bordered'"
  [class.border-base-300]="surface() === 'bordered'"
  [class.bg-base-100]="surface() === 'bordered'"
  [class.sui-navbar--comfortable]="inset() === 'comfortable'"
  [class.sui-navbar--sm]="size() === 'sm'"
  [class.sui-navbar--horizontal]="orientation() === 'horizontal'"
  [class.sui-navbar--menu-center]="items().length && menuAlign() === 'center'"
  [attr.aria-label]="ariaLabel()"
  [attr.data-collapsible]="collapsible()"
  [attr.data-expanded]="state.expanded() ? '' : null"
>
  @if (brand()) {
    <div class="navbar-start gap-2">
      <ng-content select="[suiNavbarBrand]" />
    </div>
  }

  @if (customContent()) {
    <ng-content select="[suiNavbarContent]" />
  } @else if (items().length && collapsible()) {
    <div suiNavbarContent class="lg:flex-1" [class.sui-navbar__menu-offset]="brand()">
      <sui-navbar-menu
        [items]="items()"
        [value]="value()"
        [orientation]="orientation()"
        [variant]="variant()"
        [ariaLabel]="ariaLabel()"
        [template]="itemTemplate()"
        (itemSelected)="itemSelected.emit($event)"
      />
    </div>
  } @else if (items().length) {
    <sui-navbar-menu
      [class.sui-navbar__menu-offset]="brand()"
      [items]="items()"
      [value]="value()"
      [orientation]="orientation()"
      [variant]="variant()"
      [ariaLabel]="ariaLabel()"
      [template]="itemTemplate()"
      (itemSelected)="itemSelected.emit($event)"
    />
  }

  @if (actions().length || (collapsible() && hasContent())) {
    <div class="navbar-end gap-1">
      <ng-content select="[suiNavbarAction]" />
      @if (collapsible() && hasContent()) {
        <button suiButton suiNavbarToggle size="sm" shape="square" severity="neutral" variant="text">
          <svg lucideMenu class="size-5" aria-hidden="true"></svg>
        </button>
      }
    </div>
  }
</nav>
