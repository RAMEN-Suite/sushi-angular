<label
  class="otp"
  [class.otp-joined]="joined()"
  [class.otp-xs]="size() === 'xs'"
  [class.otp-sm]="size() === 'sm'"
  [class.otp-lg]="size() === 'lg'"
  [class.otp-xl]="size() === 'xl'"
  [class.otp-error]="invalid()"
  [class.sui-input-otp--disabled]="disabled()"
>
  @for (index of indices(); track index) {
    <span aria-hidden="true"></span>
  }
  <input
    #inputElement
    [id]="id()"
    [type]="masked() ? 'password' : 'text'"
    [inputMode]="numeric() ? 'numeric' : 'text'"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-disabled]="disabled() || null"
    [maxLength]="length()"
    [pattern]="numeric() ? '[0-9]{' + length() + '}' : '.{' + length() + '}'"
    autocomplete="one-time-code"
    [attr.aria-label]="ariaLabelledby() ? null : ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-describedby]="ariaDescribedby()"
    [attr.aria-invalid]="invalid() || null"
    (input)="handleInput($event)"
    (blur)="touch.emit()"
  />
</label>
