<div
  class="max-w-full rounded-box border p-1.5"
  [class.border-base-300]="!popup()"
  [class.bg-base-100]="!popup()"
  [class.sui-internal-overlay-surface]="popup()"
  [class.w-60]="!fluid()"
  [class.w-full]="fluid()"
  [class.pointer-events-none]="disabled()"
  [class.sui-internal-disabled-opacity]="disabled()"
>
  @if (startTemplate(); as template) {
    <ng-container [ngTemplateOutlet]="template" />
  }

  <sui-menu-level
    [items]="items()"
    [id]="id()"
    [ariaLabel]="ariaLabel()"
    [ariaLabelledby]="ariaLabelledby()"
    [disabled]="disabled()"
    [severity]="severity()"
    [size]="size()"
    [wrap]="wrap()"
    [typeaheadDelay]="typeaheadDelay()"
    [itemTemplate]="itemTemplate()"
    [groupTemplate]="groupTemplate()"
    (itemSelected)="itemSelected.emit($event)"
    (escapePressed)="escapePressed.emit(undefined)"
  />

  @if (endTemplate(); as template) {
    <ng-container [ngTemplateOutlet]="template" />
  }
</div>
