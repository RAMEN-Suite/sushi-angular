<div class="min-h-screen bg-base-100 text-base-content">
  <header class="sticky top-0 z-40 border-b border-base-300 bg-base-100/95 backdrop-blur lg:hidden">
    <sui-navbar [items]="mobileNavigation" [value]="activePath()" surface="plain" variant="menu" ariaLabel="Component navigation">
      <div suiNavbarBrand class="inline-flex items-center gap-3 px-2">
        <span class="grid size-8 place-items-center rounded-field bg-primary text-primary-content">
          <svg lucideSoup class="size-4" aria-hidden="true"></svg>
        </span>
        <span>
          <strong class="block leading-tight">SUSHI</strong>
          <span class="block text-xs leading-tight text-base-content/50">Playground</span>
        </span>
      </div>

      <button
        suiButton
        suiNavbarAction
        type="button"
        size="sm"
        shape="square"
        severity="neutral"
        variant="text"
        [attr.aria-label]="theme() === 'sushi' ? 'Use dark theme' : 'Use light theme'"
        (click)="toggleTheme()"
      >
        @if (theme() === 'sushi') {
          <svg lucideMoon class="size-4" aria-hidden="true"></svg>
        } @else {
          <svg lucideSun class="size-4" aria-hidden="true"></svg>
        }
      </button>
    </sui-navbar>
  </header>

  <div class="grid min-h-screen lg:grid-cols-[17rem_1fr]">
    <aside class="sticky top-0 hidden h-screen flex-col border-r border-base-300 bg-base-100 lg:flex">
      <div class="flex h-16 items-center border-b border-base-300 px-3">
        <sui-navbar [collapsible]="false" surface="plain" size="sm" ariaLabel="Playground home">
          <div suiNavbarBrand class="inline-flex items-center gap-2.5 px-2">
            <span class="grid size-8 place-items-center rounded-field bg-primary text-primary-content">
              <svg lucideSoup class="size-4" aria-hidden="true"></svg>
            </span>
            <span>
              <strong class="block leading-tight">SUSHI</strong>
              <span class="block text-xs leading-tight text-base-content/50">Component Playground</span>
            </span>
          </div>
        </sui-navbar>
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto px-3 py-4">
        <div class="mb-5">
          <sui-navbar
            [items]="overviewNavigation"
            [value]="activePath()"
            [collapsible]="false"
            orientation="vertical"
            surface="plain"
            variant="menu"
            ariaLabel="Overview"
          />
        </div>

        @for (group of sidebar; track group.label) {
          <section class="mb-5 last:mb-0">
            <h2 class="mb-1.5 px-3 text-xs font-semibold uppercase tracking-wide text-base-content/45">
              {{ group.label }}
            </h2>
            <sui-navbar
              [items]="group.items"
              [value]="activePath()"
              [collapsible]="false"
              orientation="vertical"
              surface="plain"
              variant="menu"
              [ariaLabel]="group.label"
            />
          </section>
        }
      </div>

      <div class="border-t border-base-300 p-3">
        <button suiButton type="button" shape="fluid" severity="neutral" variant="outlined" (click)="toggleTheme()">
          @if (theme() === 'sushi') {
            <svg lucideMoon class="size-4" aria-hidden="true"></svg>
            Dark theme
          } @else {
            <svg lucideSun class="size-4" aria-hidden="true"></svg>
            Light theme
          }
        </button>
      </div>
    </aside>

    <main class="min-w-0">
      @if (pagePath()) {
        <header class="z-30 border-b border-base-300 bg-base-100/95 backdrop-blur lg:sticky lg:top-0">
          <div class="mx-auto flex h-16 max-w-7xl items-center px-3 sm:px-7">
            <sui-navbar
              class="w-full"
              [items]="documentationItems()"
              [value]="currentPath()"
              [collapsible]="false"
              orientation="horizontal"
              surface="plain"
              size="sm"
              ariaLabel="Component documentation"
            />
          </div>
        </header>
      }

      <router-outlet />
    </main>
  </div>
</div>
