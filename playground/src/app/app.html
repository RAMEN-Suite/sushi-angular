<div class="min-h-screen bg-base-100 text-base-content">
  <div class="grid min-h-screen grid-cols-[18rem_1fr]">
    <aside class="sticky top-0 h-screen border-r border-base-300 bg-base-100">
      <div class="flex h-full flex-col">
        <div class="border-b border-base-300 px-6 py-5">
          <a routerLink="/" class="block">
            <div class="text-xl font-bold tracking-tight">SUSHI</div>
            <div class="mt-1 text-sm text-base-content/60">Component Playground</div>
          </a>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 py-5">
          @for (group of sidebar; track group.label) {
            <section class="mb-6 last:mb-0">
              <h2 class="mb-2 px-2 text-xs font-semibold uppercase tracking-wide text-base-content/50">
                {{ group.label }}
              </h2>

              <div class="space-y-1">
                @for (item of group.items; track item.path) {
                  <a
                    class="flex rounded-field px-3 py-2 text-sm transition hover:bg-base-200"
                    [routerLink]="item.path"
                    routerLinkActive="bg-base-200 font-semibold text-base-content"
                    [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                  >
                    {{ item.label }}
                  </a>
                }
              </div>
            </section>
          }
        </nav>

        <div class="border-b border-t border-base-300 px-6 py-5">
          <button suiButton shape="fluid" (click)="toggleTheme()">{{ theme() === 'sushi' ? 'Dark Mode' : 'Light Mode' }}</button>
        </div>
      </div>
    </aside>

    <main class="min-w-0">
      <router-outlet />
    </main>
  </div>
</div>
