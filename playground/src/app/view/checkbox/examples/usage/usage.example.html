<div class="grid gap-5">
  <label class="flex items-center gap-3"><input suiCheckbox type="checkbox" [formField]="preferencesForm.accepted" />Accept terms</label>
  <div class="flex flex-wrap items-center gap-5">
    <label class="flex items-center gap-2"><input suiCheckbox type="checkbox" checked severity="success" size="sm" />Complete</label>
    <label class="flex items-center gap-2"><input suiCheckbox type="checkbox" [indeterminate]="true" />Partially selected</label>
    <label class="flex items-center gap-2"><input suiCheckbox type="checkbox" invalid />Invalid</label>
    <label class="flex items-center gap-2"><input suiCheckbox type="checkbox" disabled />Disabled</label>
  </div>
  <button suiButton type="button" class="w-fit" severity="neutral" variant="soft" (click)="reset()">Reset</button>
</div>
