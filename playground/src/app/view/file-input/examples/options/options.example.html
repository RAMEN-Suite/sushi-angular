<div class="grid gap-8">
  <label class="grid w-96 max-w-full gap-2">
    <span class="font-medium">Profile photo from camera</span>
    <input suiFileInput type="file" accept="image/*" capture="user" />
  </label>

  <div class="grid items-start gap-6 lg:grid-cols-2">
    <fieldset suiFieldset>
      <legend suiFieldsetLegend>Sizes</legend>
      <div class="grid gap-3">
        @for (size of sizes; track size) {
          <label class="grid gap-1.5">
            <span class="flex items-center justify-between gap-3 text-sm font-medium">
              {{ size.toUpperCase() }}
              <code suiBadge severity="neutral" variant="soft" size="xs" class="font-mono">size="{{ size }}"</code>
            </span>
            <input suiFileInput type="file" class="w-full" [size]="size" />
          </label>
        }
      </div>
    </fieldset>

    <fieldset suiFieldset>
      <legend suiFieldsetLegend>Semantic colors</legend>
      <div class="grid gap-3">
        @for (color of colors; track color) {
          <label class="grid gap-1.5">
            <span class="text-sm font-medium">{{ color }}</span>
            <input suiFileInput type="file" class="w-full" size="sm" [severity]="color" />
          </label>
        }
      </div>
    </fieldset>
  </div>
</div>
