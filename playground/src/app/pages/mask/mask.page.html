<main class="pg-page">
  <section class="pg-page__header">
    <p class="text-sm font-medium text-primary">Examples</p>
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Mask</h1>
      <p class="text-lg text-base-content/70">Crop images or other elements to a built-in shape.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Mask architecture">
      <span suiBadge severity="neutral" variant="soft" size="sm">Directive</span>
    </div>
  </section>

  <section class="pg-page__section">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Shapes and halves</h2>
      <p class="text-base-content/60">Apply a mask directly to an image and optionally retain only one half.</p>
    </div>
    <pg-example-code [html]="example.html" [typescript]="example.typescript">
      <ng-template pgExamplePreview><pg-mask-gallery-example /></ng-template>
    </pg-example-code>
  </section>
</main>
