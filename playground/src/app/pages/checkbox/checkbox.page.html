<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Checkbox</h1>
      <p class="max-w-3xl text-lg text-base-content/70">Add consistent appearance and form state to a native checkbox.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Checkbox architecture">
      <span suiBadge variant="soft" size="sm">Directive</span>
      <span suiBadge variant="soft" size="sm">Native element</span>
      <span suiBadge variant="soft" size="sm">Signal Forms</span>
    </div>
  </section>

  <sui-card
    ><h2 suiCardTitle>Usage, appearance, and states</h2>
    <p class="text-base-content/60">
      Native checked, disabled, and indeterminate behavior remains intact while size, severity, and invalid state stay consistent.
    </p>
    <sui-card size="sm" class="mt-5"><pg-checkbox-usage-example /></sui-card>
    <div class="mt-6"><pg-example-code [html]="example.html" [typescript]="example.typescript" /></div
  ></sui-card>
</main>
