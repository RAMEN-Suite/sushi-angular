<div class="grid max-w-2xl gap-6">
  <sui-card size="sm">
    <div class="grid divide-y divide-base-300">
      <label suiLabel class="flex cursor-pointer items-start gap-3 py-3 text-sm first:pt-0 last:pb-0">
        <input suiCheckbox type="checkbox" class="mt-0.5" [formField]="preferencesForm.accepted" />
        <span>
          <strong class="block">Accept workspace terms</strong>
          <small class="text-xs text-base-content/60">Required before collaborators can be invited.</small>
        </span>
      </label>
      <label suiLabel class="flex cursor-pointer items-start gap-3 py-3 text-sm last:pb-0">
        <input suiCheckbox type="checkbox" class="mt-0.5" checked severity="success" />
        <span>
          <strong class="block">Weekly summary</strong>
          <small class="text-xs text-base-content/60">Receive one concise activity email every Monday.</small>
        </span>
      </label>
      <label suiLabel class="flex cursor-pointer items-start gap-3 py-3 text-sm last:pb-0">
        <input suiCheckbox type="checkbox" class="mt-0.5" disabled />
        <span>
          <strong class="block">Security reports</strong>
          <small class="text-xs text-base-content/60">Managed by your organization.</small>
        </span>
      </label>
    </div>
  </sui-card>

  <sui-card size="xs" variant="plain">
    <div class="flex flex-wrap items-center gap-5">
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" [indeterminate]="true" />
        Some items
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" invalid touched />
        Needs attention
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" size="sm" checked />
        Compact
      </label>
    </div>
  </sui-card>

  <div class="grid gap-3">
    <h3 class="font-semibold">Semantic colors</h3>
    <div class="flex flex-wrap gap-x-5 gap-y-3">
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" severity="primary" checked />
        Primary
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" severity="secondary" checked />
        Secondary
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" severity="accent" checked />
        Accent
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" severity="success" checked />
        Success
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" severity="warning" checked />
        Warning
      </label>
      <label suiLabel class="flex items-center gap-2">
        <input suiCheckbox type="checkbox" severity="error" checked />
        Error
      </label>
    </div>
  </div>
  <button suiButton type="button" class="w-fit" severity="neutral" variant="soft" (click)="reset()">Reset</button>
</div>
