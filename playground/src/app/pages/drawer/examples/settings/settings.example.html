<button suiButton type="button" [suiDrawerTrigger]="filterDrawer">
  <svg lucideSlidersHorizontal class="size-3.5" aria-hidden="true"></svg>
  Edit filters
</button>

<sui-drawer #filterDrawer="suiDrawer" placement="end" ariaLabelledby="filter-drawer-title">
  <div class="flex h-full flex-col bg-base-100">
    <div class="flex items-start justify-between gap-4 border-b border-base-300 p-4">
      <span>
        <strong id="filter-drawer-title" class="block text-lg">Workspace filters</strong>
        <span class="text-sm text-base-content/60">Refine the current project view.</span>
      </span>
      <button
        suiButton
        type="button"
        size="sm"
        shape="square"
        severity="neutral"
        variant="text"
        [suiDrawerClose]="filterDrawer"
        aria-label="Close filters">
        <svg lucideX class="size-3.5" aria-hidden="true"></svg>
      </button>
    </div>

    <div class="grid flex-1 content-start gap-5 overflow-y-auto p-4">
      <fieldset suiFieldset>
        <legend suiFieldsetLegend>Status</legend>
        <div class="grid gap-3">
          <label suiLabel class="flex items-center gap-3">
            <input suiCheckbox type="checkbox" checked />
            Active
          </label>
          <label suiLabel class="flex items-center gap-3">
            <input suiCheckbox type="checkbox" />
            In review
          </label>
          <label suiLabel class="flex items-center gap-3">
            <input suiCheckbox type="checkbox" />
            Archived
          </label>
        </div>
      </fieldset>

      <fieldset suiFieldset>
        <legend suiFieldsetLegend>Ownership</legend>
        <div class="grid gap-3">
          <label suiLabel class="flex items-center gap-3">
            <input suiCheckbox type="checkbox" checked />
            Assigned to me
          </label>
          <label suiLabel class="flex items-center gap-3">
            <input suiCheckbox type="checkbox" />
            Unassigned
          </label>
        </div>
      </fieldset>
    </div>

    <div class="flex justify-end gap-2 border-t border-base-300 p-4">
      <button suiButton type="button" severity="neutral" variant="soft" [suiDrawerClose]="filterDrawer">Cancel</button>
      <button suiButton type="button" [suiDrawerClose]="filterDrawer">Apply filters</button>
    </div>
  </div>
</sui-drawer>
