<button suiButton type="button" severity="neutral" variant="outlined" [suiDrawerTrigger]="cartDrawer">
  <svg lucideShoppingBag class="size-3.5" aria-hidden="true"></svg>
  Cart
  <span suiBadge size="xs" variant="soft">{{ itemCount() }}</span>
</button>

<sui-drawer
  #cartDrawer="suiDrawer"
  placement="end"
  size="lg"
  ariaLabelledby="cart-title"
  ariaDescribedby="cart-description">
  <div suiDrawerHeader class="flex items-start justify-between gap-4 border-b border-base-300 bg-base-100 p-5">
    <div>
      <strong id="cart-title" class="block text-lg">Your cart</strong>
      <span id="cart-description" class="text-sm text-base-content/60">Review quantities before checkout.</span>
    </div>
    <button
      suiButton
      type="button"
      size="sm"
      shape="square"
      severity="neutral"
      variant="text"
      [suiDrawerClose]="cartDrawer"
      aria-label="Close cart">
      <svg lucideX class="size-3.5" aria-hidden="true"></svg>
    </button>
  </div>

  <div class="min-h-full bg-base-100 p-5">
    <sui-list [items]="items()" size="sm" ariaLabel="Cart items">
      <ng-template suiListItem let-item>
        <div
          class="col-span-full grid min-h-24 w-full grid-cols-[6rem_minmax(0,1fr)_auto] grid-rows-[auto_1fr] gap-x-4 gap-y-3 py-2">
          <div
            class="row-span-2 grid h-full min-h-24 w-24 place-items-center rounded-field bg-base-200 text-3xl"
            aria-hidden="true">
            {{ item.image }}
          </div>
          <div class="min-w-0">
            <strong class="block">{{ item.name }}</strong>
            <small class="text-base-content/60">{{ item.detail }}</small>
          </div>
          <button
            suiButton
            type="button"
            size="xs"
            shape="square"
            severity="neutral"
            variant="text"
            class="justify-self-end self-start"
            [attr.aria-label]="'Remove ' + item.name"
            (click)="removeItem(item.id)">
            <svg lucideTrash2 class="size-3" aria-hidden="true"></svg>
          </button>
          <div class="flex items-end gap-2 self-end">
            <button
              suiButton
              type="button"
              size="xs"
              shape="square"
              severity="neutral"
              variant="outlined"
              [disabled]="item.quantity === 1"
              [attr.aria-label]="'Reduce ' + item.name"
              (click)="changeQuantity(item.id, -1)">
              <svg lucideMinus class="size-3" aria-hidden="true"></svg>
            </button>
            <span class="min-w-6 self-center text-center text-sm tabular-nums">{{ item.quantity }}</span>
            <button
              suiButton
              type="button"
              size="xs"
              shape="square"
              severity="neutral"
              variant="outlined"
              [attr.aria-label]="'Add ' + item.name"
              (click)="changeQuantity(item.id, 1)">
              <svg lucidePlus class="size-3" aria-hidden="true"></svg>
            </button>
          </div>
          <span class="self-end justify-self-end font-medium tabular-nums">€{{ item.price * item.quantity }}</span>
        </div>
      </ng-template>
    </sui-list>
  </div>

  <div suiDrawerFooter class="grid gap-3 border-t border-base-300 bg-base-100 p-5">
    <div class="flex items-center justify-between text-sm">
      <span class="text-base-content/60">Subtotal</span>
      <span>€{{ subtotal() }}</span>
    </div>
    <div class="flex items-center justify-between text-sm">
      <span class="text-base-content/60">Shipping</span>
      <span>{{ shipping() === 0 ? 'Free' : '€' + shipping() }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-base-content/60">Total</span>
      <strong class="text-lg">€{{ total() }}</strong>
    </div>
    <button suiButton type="button" shape="fluid">Checkout</button>
  </div>
</sui-drawer>
