<button suiButton type="button" [suiDrawerTrigger]="navigationDrawer">
  <svg lucideMenu class="size-3.5" aria-hidden="true"></svg>
  Open navigation
</button>

<sui-drawer #navigationDrawer="suiDrawer" size="sm" ariaLabel="Workspace navigation">
  <sui-sidebar
    class="h-full w-full"
    [groups]="groups"
    [(value)]="activePage"
    ariaLabel="SUSHI pages"
    (valueChange)="navigationDrawer.close()">
    <div suiSidebarHeader class="relative flex min-h-16 items-center justify-center px-12">
      <span class="flex min-w-0 items-center gap-3">
        <svg lucideSoup class="size-5 shrink-0 text-primary" aria-hidden="true"></svg>
        <strong class="truncate">SUSHI KIT</strong>
      </span>
      <button
        suiButton
        type="button"
        size="sm"
        shape="square"
        severity="neutral"
        variant="text"
        class="absolute right-3"
        [suiDrawerClose]="navigationDrawer"
        aria-label="Close navigation">
        <svg lucideX class="size-3.5" aria-hidden="true"></svg>
      </button>
    </div>
  </sui-sidebar>
</sui-drawer>
