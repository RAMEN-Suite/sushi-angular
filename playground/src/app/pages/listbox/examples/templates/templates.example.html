<div class="w-full max-w-xl">
  <span suiLabel id="reviewer-listbox-label" class="font-medium">Assign reviewer</span>

  <sui-listbox
    filter
    class="mt-4"
    ariaLabelledby="reviewer-listbox-label"
    filterPlaceholder="Find a reviewer"
    [options]="reviewers"
    [formField]="reviewerForm.reviewer">
    <ng-template suiListboxGroup let-group>
      <span>{{ group }}</span>
    </ng-template>

    <ng-template [suiListboxItem]="reviewers" let-reviewer let-disabled="disabled">
      <div class="flex min-w-0 items-center gap-3">
        <sui-avatar placeholder shape="circle" size="sm" class="shrink-0">
          <span>{{ reviewer.initials }}</span>
        </sui-avatar>
        <span class="min-w-0 grow">
          <strong class="block truncate">{{ reviewer.label }}</strong>
          <span class="block truncate text-sm text-base-content/60">
            {{ reviewer.role }}
          </span>
        </span>
        <span suiBadge size="sm" [severity]="disabled ? 'neutral' : 'success'" variant="soft">
          {{ disabled ? 'Unavailable' : 'Available' }}
        </span>
      </div>
    </ng-template>

    <ng-template suiListboxEmptyFilter>No reviewer matches this search.</ng-template>
  </sui-listbox>
</div>
