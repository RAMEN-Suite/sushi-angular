<div class="w-full max-w-sm">
  <span suiLabel id="workspace-listbox-label" class="font-medium">Active workspace</span>
  <p id="workspace-listbox-hint" class="mt-1 text-sm text-base-content/60">
    Use the arrow keys to move and Space to select.
  </p>

  <sui-listbox
    class="mt-4"
    ariaLabelledby="workspace-listbox-label"
    ariaDescribedby="workspace-listbox-hint"
    [options]="workspaces"
    [formField]="workspaceForm.workspace" />

  <p class="mt-3 text-sm text-base-content/60">Selected: {{ workspaceForm.workspace().value() }}</p>
</div>
