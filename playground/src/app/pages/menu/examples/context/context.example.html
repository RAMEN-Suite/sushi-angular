<div class="grid w-full max-w-xl gap-3">
  <sui-card
    size="sm"
    variant="dash"
    tabindex="0"
    class="min-h-40 outline-none focus-visible:sui-focus-ring"
    [suiContextMenuTrigger]="draftMenu">
    <div class="grid place-content-center gap-2 text-center">
      <strong>Quarterly release draft</strong>
      <span class="text-sm text-base-content/60">
        Right-click this surface or press
        <kbd suiKbd size="sm">Shift + F10</kbd>
        .
      </span>
    </div>
  </sui-card>

  <sui-menu #draftMenu popup [items]="actions" ariaLabel="Draft actions" (itemSelected)="lastAction.set($event)" />

  <p class="text-sm text-base-content/60">Last action: {{ lastAction() ?? 'None' }}</p>
</div>
