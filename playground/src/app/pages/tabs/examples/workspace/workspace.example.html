<sui-tabs class="block max-w-3xl" [(value)]="tab" variant="lift" ariaLabel="Release workspace">
  <ng-template suiTab value="overview" label="Overview">
    <div class="grid gap-5 p-2 sm:grid-cols-[1fr_auto]">
      <div>
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-lg font-semibold">Version 2.4.0</h3>
          <span suiBadge size="sm" severity="warning" variant="soft">In review</span>
        </div>
        <p class="mt-1 text-sm text-base-content/60">12 of 16 release checks are complete.</p>
        <progress suiProgress class="mt-4 w-full" severity="success" value="75" max="100">75%</progress>
      </div>
      <button suiButton type="button" size="sm" class="self-start">Open release</button>
    </div>
  </ng-template>

  <ng-template suiTab value="activity" label="Activity">
    <sui-list class="p-2" [items]="activities" ariaLabel="Release activity">
      <ng-template suiListItem let-activity>
        <span suiStatus [severity]="activity.severity"></span>
        <span class="list-col-grow">{{ activity.label }}</span>
      </ng-template>
    </sui-list>
  </ng-template>

  <ng-template suiTab value="checks" label="Checks">
    <div class="grid gap-3 p-2 sm:grid-cols-2">
      @for (check of checks; track check.label) {
        <sui-card size="xs">
          <h3 suiCardTitle>{{ check.label }}</h3>
          <span suiBadge size="sm" [severity]="check.severity" variant="soft">{{ check.state }}</span>
        </sui-card>
      }
    </div>
  </ng-template>
</sui-tabs>
