<sui-tabs
  class="block max-w-xl"
  [(value)]="tab"
  orientation="vertical"
  variant="border"
  size="sm"
  selectionMode="explicit"
  [wrap]="false"
  ariaLabel="Project settings">
  <ng-template suiTab value="general" label="General">
    <h3 class="font-semibold">General settings</h3>
    <p class="mt-1 text-sm text-(--sui-color-muted)">Manage the name and visibility of your workspace.</p>
  </ng-template>
  <ng-template suiTab value="team" label="Team">
    <h3 class="font-semibold">Team access</h3>
    <p class="mt-1 text-sm text-(--sui-color-muted)">Review who can edit and publish this project.</p>
  </ng-template>
  <ng-template suiTab value="advanced" label="Advanced" preserveContent>
    <h3 class="font-semibold">Advanced settings</h3>
    <p class="mt-1 text-sm text-(--sui-color-muted)">This panel stays mounted after its first activation.</p>
  </ng-template>
</sui-tabs>
