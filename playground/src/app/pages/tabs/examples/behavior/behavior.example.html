<sui-tabs
  class="block max-w-xl"
  [(value)]="tab"
  orientation="vertical"
  variant="border"
  size="sm"
  selectionMode="explicit"
  focusMode="roving"
  [wrap]="false"
  [softDisabled]="false"
  ariaLabel="Project settings">
  <ng-template suiTab value="general" label="General">
    <h3 class="font-semibold">General settings</h3>
    <p class="mt-1 text-sm text-base-content/60">Manage the name and visibility of your workspace.</p>
  </ng-template>
  <ng-template suiTab value="team" label="Team">
    <h3 class="font-semibold">Team access</h3>
    <p class="mt-1 text-sm text-base-content/60">Review who can edit and publish this project.</p>
  </ng-template>
  <ng-template suiTab value="advanced" label="Advanced" [preserveContent]="false">
    <h3 class="font-semibold">Advanced settings</h3>
    <p class="mt-1 text-sm text-base-content/60">This panel is recreated whenever it becomes active.</p>
  </ng-template>
</sui-tabs>
