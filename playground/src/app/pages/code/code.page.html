<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Code</h1>
      <p class="text-lg text-base-content/70">Present terminal-like snippets with prefixes and accessible copy feedback.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Code architecture">
      <span suiBadge variant="soft" size="sm">Component</span><span suiBadge variant="soft" size="sm">Angular CDK</span
      ><span suiBadge variant="soft" size="sm">Templates</span>
    </div>
  </section>
  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Lines and prefixes</h2>
      <p class="text-base-content/60">Mark the exact lines that participate in the copied value.</p>
    </div>
    <pg-example-code [html]="examples.basic.html" [typescript]="examples.basic.typescript"
      ><ng-template pgExamplePreview><pg-code-basic-example /></ng-template
    ></pg-example-code>
  </section>
  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Copy control templates</h2>
      <p class="text-base-content/60">Replace the control or its feedback states while retaining clipboard behavior.</p>
    </div>
    <pg-example-code [html]="examples.templates.html" [typescript]="examples.templates.typescript"
      ><ng-template pgExamplePreview><pg-code-templates-example /></ng-template
    ></pg-example-code>
  </section>
</main>
