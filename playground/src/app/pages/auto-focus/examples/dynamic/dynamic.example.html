<div class="grid gap-4">
  <button suiButton type="button" class="w-fit" (click)="show()">Add search field</button>
  @if (visible()) {
    <div suiJoin class="w-full max-w-md">
      <input
        suiInput
        suiJoinItem
        suiAutoFocus
        class="min-w-0 flex-1"
        type="search"
        placeholder="Search projects"
        aria-label="Search projects" />
      <button suiButton suiJoinItem type="button" severity="neutral" variant="soft" (click)="visible.set(false)">
        Close
      </button>
    </div>
  }
</div>
