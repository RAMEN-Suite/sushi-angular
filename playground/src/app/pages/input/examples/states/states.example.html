<div class="grid w-full max-w-80 items-start gap-4">
  <div class="grid gap-2">
    <label suiLabel for="input-readonly">Readonly</label>
    <input suiInput id="input-readonly" type="email" value="reader@example.com" readonly />
  </div>

  <div class="grid gap-2">
    <label suiLabel for="input-disabled">Disabled</label>
    <input suiInput id="input-disabled" value="Unavailable" disabled />
  </div>

  <div class="grid gap-2">
    <label suiLabel for="input-invalid">Invalid</label>
    <input suiInput id="input-invalid" invalid touched value="Invalid value" />
  </div>
</div>
