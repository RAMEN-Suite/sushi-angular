<div class="grid items-start gap-6 lg:grid-cols-2">
  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Search controls</legend>

    <div class="grid gap-4">
      <label suiInputWrapper class="w-80 max-w-full">
        <svg lucideSearch class="size-4 opacity-50" aria-hidden="true"></svg>
        <input
          suiInputWrapperControl
          type="search"
          placeholder="Search documentation"
          aria-label="Search documentation" />
        <kbd suiKbd size="sm">⌘</kbd>
        <kbd suiKbd size="sm">K</kbd>
      </label>

      <div suiJoin class="w-full max-w-full sm:w-fit">
        <label suiInputWrapper suiJoinItem class="w-0 min-w-0 flex-1 sm:w-72 sm:flex-none">
          <svg lucideSearch class="size-4 opacity-50" aria-hidden="true"></svg>
          <input suiInputWrapperControl type="search" placeholder="Search components" aria-label="Search components" />
        </label>
        <button suiButton suiJoinItem type="button">Search</button>
      </div>
    </div>
  </fieldset>

  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Account fields</legend>

    <div class="grid gap-4">
      <label class="grid w-80 max-w-full gap-2">
        <span class="font-medium">Work email</span>
        <input suiInput type="email" severity="info" placeholder="name@company.com" />
      </label>

      <label class="grid w-80 max-w-full gap-2">
        <span class="font-medium">Persistent search</span>
        <input suiInput type="search" size="sm" value="Quarterly report" [showClear]="false" />
      </label>
    </div>
  </fieldset>
</div>
