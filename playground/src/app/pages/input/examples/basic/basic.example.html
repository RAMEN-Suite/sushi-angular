<div class="grid w-fit max-w-full gap-2">
  <label for="input-name" class="font-medium">Name</label>

  <div suiJoin class="w-full max-w-full sm:w-fit">
    <input
      id="input-name"
      suiInput
      suiJoinItem
      class="w-0 min-w-0 flex-1 sm:w-72 sm:flex-none"
      placeholder="Ada Lovelace"
      aria-describedby="input-name-hint"
      [formField]="form.name" />

    <button suiButton suiJoinItem type="button" severity="neutral" variant="soft" (click)="reset()">
      Reset example
    </button>
  </div>
</div>

<p id="input-name-hint" class="mt-3 text-sm text-base-content/60">
  Current value: {{ form.name().value() || 'Empty' }}
</p>
