<div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
  @for (item of types; track item.type) {
    <sui-card size="sm">
      <label suiLabel class="grid gap-2">
        <span class="flex items-center justify-between gap-3 font-medium">
          {{ item.label }}
          <code suiBadge severity="neutral" variant="soft" size="xs" class="font-mono">{{ item.type }}</code>
        </span>

        <input suiInput fluid [type]="item.type" [placeholder]="item.placeholder" />
      </label>
    </sui-card>
  }
</div>
