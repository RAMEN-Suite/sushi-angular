<div class="grid gap-5">
  <label class="flex items-center justify-between gap-4"
    ><span><strong class="block">Notifications</strong><small class="text-base-content/60">Receive account updates.</small></span
    ><input suiToggle type="checkbox" severity="primary" [formField]="notificationForm.notifications"
  /></label>
  <div class="flex flex-wrap items-center gap-5">
    <label class="flex items-center gap-2"><input suiToggle type="checkbox" size="sm" checked />Compact</label
    ><label class="flex items-center gap-2"><input suiToggle type="checkbox" invalid />Invalid</label
    ><label class="flex items-center gap-2"><input suiToggle type="checkbox" disabled />Disabled</label>
  </div>
  <button suiButton type="button" class="w-fit" severity="neutral" variant="soft" (click)="reset()">Reset</button>
</div>
