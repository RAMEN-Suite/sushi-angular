<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Toggle</h1>
      <p class="text-lg text-base-content/70">Represent an immediate on-or-off setting with native switch semantics.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Toggle architecture">
      <span suiBadge variant="soft" size="sm">Directive</span>
      <span suiBadge variant="soft" size="sm">Native element</span>
      <span suiBadge variant="soft" size="sm">Signal Forms</span>
    </div>
  </section>

  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Usage, appearance, and states</h2>
      <p class="text-base-content/60">
        The native checkbox remains the source of truth while the directive supplies switch semantics and shared form-control tokens.
      </p>
    </div>
    <pg-example-code [html]="example.html" [typescript]="example.typescript">
      <ng-template pgExamplePreview><pg-toggle-usage-example /></ng-template>
    </pg-example-code>
  </section>
</main>
