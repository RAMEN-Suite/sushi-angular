<div class="grid gap-5 lg:grid-cols-2">
  <sui-card size="sm" class="min-h-48">
    <div class="grid flex-1 place-items-center text-center" role="status" aria-live="polite">
      <div>
        <span suiSpinner type="ring" size="lg" class="text-primary"></span>
        <p class="mt-3 font-medium">Preparing dashboard</p>
        <p class="mt-1 text-sm text-base-content/60">This may take a few seconds.</p>
      </div>
    </div>
  </sui-card>

  <sui-card size="sm">
    <h3 suiCardTitle>Recent activity</h3>
    <div class="grid gap-3">
      <div class="flex items-center justify-between gap-4 rounded-field bg-base-200 p-3">
        <span>Synchronizing events</span>
        <span suiSpinner type="dots" size="sm" class="text-info"></span>
      </div>
      <div class="flex items-center justify-between gap-4 rounded-field bg-base-200 p-3">
        <span>Indexing documents</span>
        <span suiSpinner type="bars" size="sm" class="text-secondary"></span>
      </div>
    </div>
    <button suiButton type="button" class="w-36" loading>
      <span suiSpinner size="sm"></span>
      Saving
    </button>
  </sui-card>
</div>
