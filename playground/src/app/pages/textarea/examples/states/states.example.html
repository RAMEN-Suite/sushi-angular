<fieldset suiFieldset>
  <legend suiFieldsetLegend>Review states</legend>

  <div class="grid items-start gap-4 lg:grid-cols-3">
    <div class="grid gap-2">
      <label suiLabel for="textarea-readonly">Readonly</label>
      <textarea suiTextarea id="textarea-readonly" resize="none" rows="4" readonly>
Approved content cannot be edited.</textarea>
    </div>

    <div class="grid gap-2">
      <label suiLabel for="textarea-disabled">Disabled</label>
      <textarea suiTextarea id="textarea-disabled" resize="none" rows="4" disabled>Comments are unavailable.</textarea>
    </div>

    <div class="grid gap-2">
      <label suiLabel for="textarea-invalid">Invalid</label>
      <textarea suiTextarea id="textarea-invalid" resize="none" rows="4" invalid touched>
Missing required evidence.</textarea>
    </div>
  </div>
</fieldset>
