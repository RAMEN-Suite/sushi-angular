<div class="grid w-96 max-w-full gap-2">
  <label suiLabel for="textarea-message">Message</label>
  <div suiJoin orientation="vertical">
    <textarea
      id="textarea-message"
      suiTextarea
      suiJoinItem
      class="w-full"
      rows="4"
      placeholder="Write a message"
      [formField]="form.message"></textarea>

    <button suiButton suiJoinItem type="button" severity="neutral" variant="soft" (click)="reset()">
      Reset example
    </button>
  </div>
  <p class="text-sm text-base-content/60">{{ form.message().value().length }}/240 characters</p>
</div>
