<div class="grid w-80 max-w-full gap-6">
  <div class="grid gap-2">
    <label suiLabel for="input-number-invoice">Invoice amount</label>
    <sui-input-number
      id="input-number-invoice"
      fluid
      prefix="$"
      suffix="USD"
      [minFractionDigits]="2"
      [maxFractionDigits]="2" />
  </div>

  <div class="grid gap-2">
    <label suiLabel for="input-number-distance">Distance</label>
    <sui-input-number id="input-number-distance" fluid prefix="≈ " suffix="km" [value]="42" />
  </div>

  <div class="grid gap-2">
    <label suiLabel for="input-number-invalid">Invalid quantity</label>
    <sui-input-number id="input-number-invalid" fluid invalid ariaDescribedby="input-number-error" [value]="120" />
    <p id="input-number-error" class="text-sm text-error">Enter a quantity between 1 and 99.</p>
  </div>

  <div class="grid gap-2">
    <label suiLabel for="input-number-disabled">Disabled quantity</label>
    <sui-input-number id="input-number-disabled" fluid disabled [value]="42" />
  </div>
</div>
