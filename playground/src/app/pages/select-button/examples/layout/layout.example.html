<div class="grid gap-8">
  <div class="grid items-start gap-6 sm:grid-cols-2">
    <div class="grid gap-2">
      <span suiLabel id="select-button-optional-label" class="font-medium">Optional view</span>
      <sui-select-button
        allowEmpty
        ariaLabelledby="select-button-optional-label"
        [options]="options"
        [(value)]="value" />
      <small class="text-base-content/60">Select the active view again to clear it.</small>
    </div>
    <div class="grid gap-2">
      <span suiLabel id="select-button-vertical-label" class="font-medium">Vertical navigation</span>
      <sui-select-button
        orientation="vertical"
        ariaLabelledby="select-button-vertical-label"
        [options]="options"
        value="grid" />
    </div>
  </div>

  <div class="grid gap-4">
    <div>
      <h3 class="font-semibold">Semantic colors</h3>
      <p class="text-sm text-base-content/60">Each group keeps one color across its outlined and filled states.</p>
    </div>
    <div class="grid items-start gap-4 sm:grid-cols-2 xl:grid-cols-3">
      <sui-select-button severity="primary" [options]="priorityOptions" value="medium" ariaLabel="Primary priority" />
      <sui-select-button
        severity="secondary"
        [options]="priorityOptions"
        value="medium"
        ariaLabel="Secondary priority" />
      <sui-select-button severity="accent" [options]="priorityOptions" value="medium" ariaLabel="Accent priority" />
      <sui-select-button severity="success" [options]="priorityOptions" value="medium" ariaLabel="Success priority" />
      <sui-select-button severity="warning" [options]="priorityOptions" value="medium" ariaLabel="Warning priority" />
      <sui-select-button severity="error" [options]="priorityOptions" value="medium" ariaLabel="Error priority" />
    </div>
  </div>
</div>
