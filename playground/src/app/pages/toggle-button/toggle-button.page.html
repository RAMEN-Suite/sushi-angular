<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Toggle Button</h1>
      <p class="max-w-3xl text-lg text-base-content/70">Toggle a boolean action while keeping pressed state visible and accessible.</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <span suiBadge variant="soft" size="sm">ARIA pressed</span><span suiBadge variant="soft" size="sm">Signal Forms</span
      ><span suiBadge variant="soft" size="sm">Templates</span>
    </div>
  </section>
  <sui-card
    ><h2 suiCardTitle>Usage, templates, and states</h2>
    <p class="text-base-content/60">
      Labels, on/off content, the complete control, size, disabled, and loading behavior can be configured without replacing state logic.
    </p>
    <sui-card size="sm" class="mt-5 border border-base-300 bg-base-200/30 shadow-none"><pg-toggle-button-usage-example /></sui-card>
    <div class="mt-6"><pg-example-code [html]="example.html" [typescript]="example.typescript" /></div
  ></sui-card>
</main>
