<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Toggle Button</h1>
      <p class="text-lg text-base-content/70">Toggle a boolean action while keeping pressed state visible and accessible.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Toggle Button architecture">
      <span suiBadge variant="soft" size="sm">Component</span>
      <span suiBadge variant="soft" size="sm">Signal Forms</span>
      <span suiBadge variant="soft" size="sm">Templates</span>
    </div>
  </section>

  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Usage, templates, and states</h2>
      <p class="text-base-content/60">
        Labels, on/off content, the complete control, size, disabled, and loading behavior can be configured without replacing state logic.
      </p>
    </div>
    <pg-example-code [html]="example.html" [typescript]="example.typescript">
      <ng-template pgExamplePreview><pg-toggle-button-usage-example /></ng-template>
    </pg-example-code>
  </section>
</main>
