<sui-drawer
  #sidebarDrawer="suiDrawer"
  class="h-80 overflow-hidden rounded-box border border-base-300"
  responsiveAt="lg"
  size="sm"
  ariaLabel="Responsive workspace navigation">
  <div suiDrawerContent class="flex min-h-full flex-col bg-base-100">
    <sui-navbar [collapsible]="false" surface="plain" ariaLabel="Current workspace page">
      <strong suiNavbarBrand>{{ activePage() }}</strong>
      <button
        suiButton
        suiNavbarAction
        type="button"
        size="sm"
        shape="square"
        severity="neutral"
        variant="text"
        class="lg:hidden"
        [suiDrawerTrigger]="sidebarDrawer"
        aria-label="Open workspace navigation">
        <svg lucideMenu class="size-4" aria-hidden="true"></svg>
      </button>
    </sui-navbar>
    <div class="min-h-0 flex-1 border-t border-base-300 p-6 sm:p-8">
      <section class="mx-auto grid max-w-xl gap-5">
        <div class="space-y-1.5">
          <p class="text-sm font-medium text-primary">Current section</p>
          <h3 class="text-2xl font-semibold tracking-tight">{{ activePage() }}</h3>
          <p class="text-sm text-base-content/60">
            Choose another destination from the navigation to update this workspace.
          </p>
        </div>
        <sui-card size="sm">
          <strong>{{ activePage() }} overview</strong>
          <p class="text-sm text-base-content/60">
            The Sidebar stays available on wide screens and moves into the Drawer when space is limited.
          </p>
        </sui-card>
      </section>
    </div>
  </div>

  <sui-sidebar
    class="h-full w-full"
    size="lg"
    [groups]="groups"
    [(value)]="activePage"
    ariaLabel="Responsive workspace pages"
    (itemSelected)="sidebarDrawer.close()">
    <div suiSidebarHeader class="flex items-center justify-between gap-3">
      <strong>Workspace</strong>
      <button
        suiButton
        type="button"
        size="sm"
        shape="square"
        severity="neutral"
        variant="text"
        class="lg:hidden"
        [suiDrawerClose]="sidebarDrawer"
        aria-label="Close workspace navigation">
        <svg lucideX class="size-4" aria-hidden="true"></svg>
      </button>
    </div>
  </sui-sidebar>
</sui-drawer>
