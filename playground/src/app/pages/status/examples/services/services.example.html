<div class="grid max-w-xl gap-5">
  <sui-card size="sm">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h3 suiCardTitle>System status</h3>
        <p class="text-sm text-base-content/60">All core services are operational.</p>
      </div>
      <span suiBadge severity="success" variant="soft">
        <span suiStatus severity="success" size="sm"></span>
        Operational
      </span>
    </div>

    <sui-list class="mt-3" [items]="services" ariaLabel="Core services">
      <ng-template suiListItem let-service>
        <span class="list-col-grow">{{ service.name }}</span>
        <span class="inline-flex items-center gap-2 text-sm">
          <span suiStatus [severity]="service.severity" [animation]="service.animation"></span>
          {{ service.state }}
        </span>
      </ng-template>
    </sui-list>
  </sui-card>
</div>
