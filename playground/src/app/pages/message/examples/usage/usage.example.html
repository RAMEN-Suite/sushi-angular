<div class="grid gap-3">
  <div suiMessage severity="info" variant="soft" role="status">
    <svg lucideInfo class="size-5" aria-hidden="true"></svg>
    <span>A new version is ready to install.</span>
  </div>
  <div suiMessage severity="success" variant="soft" role="status">
    <svg lucideCircleCheck class="size-5" aria-hidden="true"></svg>
    <span>Your changes were saved.</span>
  </div>
  <div suiMessage severity="warning" variant="soft" role="alert">
    <svg lucideTriangleAlert class="size-5" aria-hidden="true"></svg>
    <span>Your session expires in five minutes.</span>
  </div>
  <div suiMessage severity="error" variant="soft" role="alert">
    <svg lucideCircleX class="size-5" aria-hidden="true"></svg>
    <span>We could not publish this release.</span>
  </div>
</div>
