<button suiButton variant="outlined" [suiPopoverTrigger]="chefPopover">
  <svg lucideChefHat class="size-4" aria-hidden="true"></svg>
  {{ selected()?.name ?? 'Assign chef' }}
</button>
<sui-popover #chefPopover ariaLabel="Select a chef" placement="bottom">
  <div class="grid w-72 gap-1">
    <div class="mb-1 grid gap-0.5 px-3 pb-2">
      <strong>Assign this order</strong>
      <span class="text-sm text-base-content/60">Choose an available chef.</span>
    </div>
    @for (member of members; track member.email) {
      <button
        suiButton
        fluid
        severity="neutral"
        variant="text"
        class="h-auto justify-start gap-3 px-3 py-2.5 text-left"
        (click)="select(member, chefPopover)">
        <span
          class="grid size-8 shrink-0 place-items-center rounded-full bg-base-200 text-xs font-semibold text-base-content">
          {{ member.name.charAt(0) }}
        </span>
        <span>
          <span class="block font-medium">{{ member.name }}</span>
          <span class="block text-xs opacity-60">{{ member.email }}</span>
        </span>
      </button>
    }
  </div>
</sui-popover>
