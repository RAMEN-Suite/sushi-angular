<div class="flex flex-wrap items-center gap-3">
  <button suiButton type="button" class="w-36" [loading]="loading()" (click)="save()">
    @if (loading()) {
      <span suiSpinner size="sm"></span>
    }
    {{ loading() ? 'Saving' : 'Save changes' }}
  </button>
  <button suiButton type="button" disabled severity="neutral">Unavailable</button>
  <button suiButton type="button" severity="neutral" variant="soft" (click)="reset()">Reset example</button>
</div>
