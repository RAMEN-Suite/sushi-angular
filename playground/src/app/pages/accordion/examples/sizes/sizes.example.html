<div class="grid gap-4 lg:grid-cols-3">
  <div class="grid content-start gap-2">
    <span class="text-sm font-medium text-base-content/60">Small · default</span>
    <sui-accordion>
      <ng-template suiAccordionItem value="small" label="Compact details">
        Designed for forms, settings, and dense layouts.
      </ng-template>
    </sui-accordion>
  </div>

  <div class="grid content-start gap-2">
    <span class="text-sm font-medium text-base-content/60">Medium</span>
    <sui-accordion size="md">
      <ng-template suiAccordionItem value="medium" label="Comfortable details">
        Adds room for general application content.
      </ng-template>
    </sui-accordion>
  </div>

  <div class="grid content-start gap-2">
    <span class="text-sm font-medium text-base-content/60">Large</span>
    <sui-accordion size="lg">
      <ng-template suiAccordionItem value="large" label="Prominent details">
        Supports richer headers and spacious page sections.
      </ng-template>
    </sui-accordion>
  </div>
</div>
