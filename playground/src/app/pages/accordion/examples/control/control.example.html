<div class="grid max-w-2xl gap-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <strong class="block">Workspace settings</strong>
      <span class="text-sm text-(--sui-color-muted)">Open one section or review the complete setup.</span>
    </div>
    <div class="flex gap-2">
      <button suiButton type="button" size="sm" severity="neutral" variant="text" (click)="settings.collapseAll()">
        Collapse
      </button>
      <button suiButton type="button" size="sm" severity="neutral" variant="soft" (click)="settings.expandAll()">
        Expand all
      </button>
    </div>
  </div>

  <sui-accordion
    #settings
    multiple
    variant="separated"
    [(value)]="open"
    style="
      --sui-accordion-trigger-min-height: 2rem;
      --sui-accordion-trigger-padding-block: 0.375rem;
      --sui-accordion-panel-padding-bottom: 0.5rem;
      --sui-accordion-gap: 0.5rem;
    ">
    <ng-template suiAccordionItem value="profile" label="Profile">
      <div class="grid gap-3 pb-2">
        <label class="grid gap-1">
          Display name
          <input suiInput value="Alex" />
        </label>
        <button suiButton type="button" (click)="saved.update(increment)">Save profile</button>
        <span role="status">Saved {{ saved() }} times</span>
      </div>
    </ng-template>
    <ng-template suiAccordionItem value="security" label="Security">
      Review sign-in methods, active sessions, and recovery options.
    </ng-template>
    <ng-template suiAccordionItem value="billing" label="Billing">
      Manage invoices and payment methods. Only workspace owners can edit this section.
    </ng-template>
  </sui-accordion>
</div>
