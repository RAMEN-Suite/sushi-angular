<div class="grid gap-6">
  <fieldset suiFieldset class="w-full max-w-xl">
    <legend suiFieldsetLegend>Documents</legend>
    <label suiLabel for="document-files">Choose documents</label>
    <input
      #input
      suiFileInput
      id="document-files"
      type="file"
      accept=".pdf,.doc,.docx"
      multiple
      aria-describedby="file-hint"
      (change)="handleFiles($event)" />
    <p id="file-hint" class="text-sm text-base-content/60">PDF or Word documents.</p>
  </fieldset>
  <p class="text-sm text-base-content/60">Selected: {{ selected().join(', ') || 'None' }}</p>
  <button suiButton type="button" class="w-fit" severity="neutral" variant="soft" (click)="reset()">
    Reset example
  </button>
</div>
