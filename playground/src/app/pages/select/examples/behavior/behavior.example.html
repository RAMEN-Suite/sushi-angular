<div class="grid max-w-3xl items-start gap-6 lg:grid-cols-2">
  <div class="grid gap-2">
    <span suiLabel id="select-workflow-label" class="font-medium">Workflow</span>
    <sui-select
      fluid
      showClear
      checkmark
      ariaLabelledby="select-workflow-label"
      placeholder="Choose a workflow"
      [options]="workflows"
      [optionHeight]="36"
      [scrollHeight]="144"
      [(value)]="value"
      (touch)="closed()" />
  </div>

  <div class="grid gap-4">
    <div class="grid gap-2">
      <span suiLabel id="select-empty-label" class="font-medium">Empty result</span>
      <sui-select
        fluid
        emptyMessage="No workflows are available."
        ariaLabelledby="select-empty-label"
        [options]="empty" />
    </div>
    <div class="grid gap-2">
      <span suiLabel id="select-loading-label" class="font-medium">Loading result</span>
      <sui-select
        fluid
        loading
        loadingMessage="Fetching workflows"
        [options]="empty"
        ariaLabelledby="select-loading-label" />
    </div>
  </div>
</div>
