<div class="grid gap-2 w-full max-w-md">
  <span suiLabel id="select-team-label" class="font-medium">Workspace team</span>
  <div suiJoin class="w-full">
    <sui-select
      suiJoinItem
      fluid
      showClear
      checkmark
      class="min-w-0 flex-1"
      ariaLabelledby="select-team-label"
      [options]="options"
      [loading]="loading()"
      [(value)]="value">
      <ng-template suiSelectHeader><strong>Available teams</strong></ng-template>
      <ng-template suiSelectFooter>
        <span class="text-sm text-base-content/60">Managed by your workspace</span>
      </ng-template>
      <ng-template suiSelectEmpty>No teams are available.</ng-template>
      <ng-template suiSelectLoading let-message>
        <span class="flex items-center gap-2">
          <span suiSpinner size="sm"></span>
          {{ message }}
        </span>
      </ng-template>
      <ng-template suiSelectLoadingIcon><span suiSpinner size="xs"></span></ng-template>
      <ng-template suiSelectDropdownIcon>
        <svg lucideChevronsUpDown class="size-4" aria-hidden="true"></svg>
      </ng-template>
      <ng-template suiSelectClearIcon><svg lucideCircleX class="size-4" aria-hidden="true"></svg></ng-template>
      <ng-template suiSelectCheckmarkIcon><svg lucideBadgeCheck class="size-4" aria-hidden="true"></svg></ng-template>
    </sui-select>
    <button
      suiButton
      suiJoinItem
      type="button"
      class="w-36"
      severity="neutral"
      variant="soft"
      (click)="toggleLoading()">
      {{ loading() ? 'Stop' : 'Preview loading' }}
    </button>
  </div>
</div>
