<div class="w-full max-w-md" suiLabel>
  <span suiFormFieldLabel id="multi-team-label">Workspace teams</span>
  <div suiJoin class="w-full">
    <sui-multi-select
      suiJoinItem
      fluid
      showClear
      showSelectAll
      class="min-w-0 flex-1"
      [options]="options"
      [loading]="loading()"
      [(value)]="value"
      ariaLabelledby="multi-team-label">
      <ng-template suiMultiSelectHeader let-count="selectedCount">
        <span class="flex items-center justify-between gap-3">
          <strong>Available teams</strong>
          <span suiBadge severity="neutral" variant="soft" size="xs">{{ count }} selected</span>
        </span>
      </ng-template>
      <ng-template suiMultiSelectFooter>
        <span class="text-sm text-base-content/60">Managed by your workspace</span>
      </ng-template>
      <ng-template suiMultiSelectEmpty>No teams are available.</ng-template>
      <ng-template suiMultiSelectLoading let-message>
        <span class="flex items-center gap-2">
          <span suiSpinner size="sm"></span>
          {{ message }}
        </span>
      </ng-template>
      <ng-template suiMultiSelectLoadingIcon><span suiSpinner size="xs"></span></ng-template>
      <ng-template suiMultiSelectDropdownIcon>
        <svg lucideChevronsUpDown class="size-4" aria-hidden="true"></svg>
      </ng-template>
      <ng-template suiMultiSelectClearIcon><svg lucideCircleX class="size-4" aria-hidden="true"></svg></ng-template>
      <ng-template suiMultiSelectCheckmarkIcon>
        <svg lucideBadgeCheck class="size-4" aria-hidden="true"></svg>
      </ng-template>
    </sui-multi-select>
    <button
      suiButton
      suiJoinItem
      type="button"
      class="w-36"
      severity="neutral"
      variant="soft"
      (click)="toggleLoading()">
      {{ loading() ? 'Stop' : 'Preview loading' }}
    </button>
  </div>
  <span suiFormFieldHint>Header, footer, state, and icon templates can be replaced independently.</span>
</div>
