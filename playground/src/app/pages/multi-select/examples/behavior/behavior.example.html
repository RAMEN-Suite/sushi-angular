<div class="grid max-w-3xl items-start gap-6 lg:grid-cols-2">
  <div class="grid gap-2">
    <span suiLabel id="multi-select-permissions-label" class="font-medium">Permissions</span>
    <sui-multi-select
      fluid
      showClear
      showSelectAll
      ariaLabelledby="multi-select-permissions-label"
      placeholder="Choose permissions"
      selectAllLabel="Include every permission"
      [options]="permissions"
      [optionHeight]="36"
      [scrollHeight]="144"
      [(value)]="value"
      (touch)="closed()" />
  </div>

  <div class="grid gap-4">
    <div class="grid gap-2">
      <span suiLabel id="multi-select-empty-label" class="font-medium">Empty result</span>
      <sui-multi-select
        fluid
        emptyMessage="No permissions are available."
        [options]="empty"
        ariaLabelledby="multi-select-empty-label" />
    </div>
    <div class="grid gap-2">
      <span suiLabel id="multi-select-loading-label" class="font-medium">Loading result</span>
      <sui-multi-select
        fluid
        loading
        loadingMessage="Fetching permissions"
        [options]="empty"
        ariaLabelledby="multi-select-loading-label" />
    </div>
  </div>
</div>
