<div class="grid max-w-5xl items-start gap-6 lg:grid-cols-3">
  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Sizes</legend>
    <div class="grid gap-4">
      <div class="grid gap-2">
        <span suiLabel id="multi-select-xs-label" class="font-medium">Extra compact</span>
        <sui-multi-select
          fluid
          size="xs"
          ariaLabelledby="multi-select-xs-label"
          [options]="options"
          [(value)]="value" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-sm-label" class="font-medium">Compact</span>
        <sui-multi-select
          fluid
          size="sm"
          ariaLabelledby="multi-select-sm-label"
          [options]="options"
          [(value)]="value" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-md-label" class="font-medium">Default</span>
        <sui-multi-select fluid ariaLabelledby="multi-select-md-label" [options]="options" [(value)]="value" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-lg-label" class="font-medium">Large</span>
        <sui-multi-select
          fluid
          size="lg"
          ariaLabelledby="multi-select-lg-label"
          [options]="options"
          [(value)]="value" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-xl-label" class="font-medium">Extra large</span>
        <sui-multi-select
          fluid
          size="xl"
          ariaLabelledby="multi-select-xl-label"
          [options]="options"
          [(value)]="value" />
      </div>
    </div>
  </fieldset>

  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Semantic colors</legend>
    <div class="grid gap-4">
      <div class="grid gap-2">
        <span suiLabel id="multi-select-primary-label" class="font-medium">Primary</span>
        <sui-multi-select
          fluid
          severity="primary"
          ariaLabelledby="multi-select-primary-label"
          [options]="options"
          [(value)]="value" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-secondary-label" class="font-medium">Secondary</span>
        <sui-multi-select
          fluid
          severity="secondary"
          [options]="options"
          [(value)]="value"
          ariaLabelledby="multi-select-secondary-label" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-success-label" class="font-medium">Success</span>
        <sui-multi-select
          fluid
          severity="success"
          [options]="options"
          [(value)]="value"
          ariaLabelledby="multi-select-success-label" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-warning-label" class="font-medium">Warning</span>
        <sui-multi-select
          fluid
          severity="warning"
          ariaLabelledby="multi-select-warning-label"
          [options]="options"
          [(value)]="value" />
      </div>
    </div>
  </fieldset>

  <fieldset suiFieldset>
    <legend suiFieldsetLegend>States</legend>
    <div class="grid gap-4">
      <div class="grid gap-2">
        <span suiLabel id="multi-select-filled-label" class="font-medium">Filled, clearable, and select all</span>
        <sui-multi-select
          fluid
          showClear
          showSelectAll
          variant="filled"
          [options]="options"
          [(value)]="value"
          ariaLabelledby="multi-select-filled-label" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-loading-state-label" class="font-medium">Loading</span>
        <sui-multi-select
          fluid
          loading
          ariaLabelledby="multi-select-loading-state-label"
          [options]="options"
          [value]="['important']" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-disabled-label" class="font-medium">Disabled</span>
        <sui-multi-select
          fluid
          disabled
          ariaLabelledby="multi-select-disabled-label"
          [options]="options"
          [value]="['work']" />
      </div>
      <div class="grid gap-2">
        <span suiLabel id="multi-select-invalid-label" class="font-medium">Invalid selection</span>
        <sui-multi-select
          fluid
          invalid
          touched
          required
          [options]="options"
          [(value)]="invalidValue"
          ariaLabelledby="multi-select-invalid-label"
          ariaDescribedby="labels-error" />
        <span class="text-xs text-base-content/60 text-error" id="labels-error">Choose at least one label.</span>
      </div>
    </div>
  </fieldset>
</div>
