<div class="grid gap-2 w-full max-w-md">
  <span suiLabel id="multi-select-teams-label" class="font-medium">Project teams</span>
  <sui-multi-select
    fluid
    class="max-w-md"
    ariaLabelledby="multi-select-teams-label"
    [options]="teams"
    [compareWith]="compareTeams"
    [(value)]="value">
    <ng-template suiMultiSelectSelectedItems let-options let-remove="remove">
      <span class="flex min-w-0 gap-1 overflow-hidden">
        @for (option of options; track option.value) {
          <sui-chip [label]="option.label" size="sm" removable (remove)="remove(option)" />
        } @empty {
          <span class="truncate text-base-content/50">Select project teams</span>
        }
      </span>
    </ng-template>
    <ng-template suiMultiSelectItem let-option let-selected="selected">
      <span class="flex w-full items-center justify-between gap-4">
        <span>{{ option.label }}</span>
        <span suiBadge severity="neutral" size="xs" variant="soft">{{ selected ? 'Included' : 'Available' }}</span>
      </span>
    </ng-template>
  </sui-multi-select>
  <span class="text-xs text-base-content/60">
    Selected content can use reusable components without changing selection behavior.
  </span>
</div>
