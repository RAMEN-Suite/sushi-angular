<div class="grid w-full max-w-md gap-2">
  <div suiLabel>
    <span suiFormFieldLabel id="countries-label">Deployment countries</span>
    <sui-multi-select
      fluid
      [options]="countries"
      [compareWith]="compareCountries"
      [optionHeight]="56"
      [scrollHeight]="220"
      [(value)]="value"
      ariaLabelledby="countries-label">
      <ng-template suiMultiSelectGroup let-group>
        <span class="flex w-full items-center justify-between gap-3">
          <span class="flex items-center gap-2 font-semibold">
            <svg lucideGlobe class="size-4" aria-hidden="true"></svg>
            {{ group }}
          </span>
          <span suiBadge severity="neutral" variant="soft" size="xs">{{ groupSize(group) }}</span>
        </span>
      </ng-template>
      <ng-template suiMultiSelectItem let-item>
        @let country = asCountry(item);
        <span class="flex min-w-0 items-center gap-3">
          <span class="text-xl" aria-hidden="true">{{ country.flag }}</span>
          <span class="min-w-0">
            <strong class="block truncate">{{ country.label }}</strong>
            <small class="text-base-content/55">{{ country.code }} · {{ country.region }}</small>
          </span>
        </span>
      </ng-template>
    </sui-multi-select>
    <span suiFormFieldHint>Choose every country that should receive this deployment.</span>
  </div>
</div>
