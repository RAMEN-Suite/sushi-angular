<div class="grid w-full max-w-md gap-2">
  <span suiLabel class="font-medium" id="multi-select-label">Message labels</span>
  <sui-multi-select fluid ariaLabelledby="multi-select-label" [options]="labels" [formField]="labelForm.labels" />
  <p class="text-sm text-base-content/60">Selected: {{ labelForm.labels().value().length }} labels</p>
</div>
