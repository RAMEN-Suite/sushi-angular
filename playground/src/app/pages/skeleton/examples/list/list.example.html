<sui-card size="sm" class="w-full max-w-2xl" role="status" aria-label="Loading recent orders">
  <div class="mb-5 grid gap-2">
    <div suiSkeleton class="h-5 w-36"></div>
    <div suiSkeleton class="h-3 w-56"></div>
  </div>
  <div class="grid gap-4">
    @for (row of rows; track row) {
      <div class="flex items-center gap-4">
        <div suiSkeleton class="size-12 shrink-0 rounded-box"></div>
        <div class="grid min-w-0 flex-1 gap-2">
          <div suiSkeleton class="h-4 w-2/3"></div>
          <div suiSkeleton class="h-3 w-1/3"></div>
        </div>
        <div suiSkeleton class="h-4 w-14"></div>
      </div>
    }
  </div>
</sui-card>
