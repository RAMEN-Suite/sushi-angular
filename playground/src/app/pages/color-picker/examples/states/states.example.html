<div class="grid w-96 max-w-full gap-5">
  <div class="grid gap-2">
    <label suiLabel id="compact-color-label" for="compact-color">Compact toolbar color</label>
    <sui-color-picker
      id="compact-color"
      class="w-fit"
      ariaLabelledby="compact-color-label"
      [showInput]="false"
      [value]="'#15803d'" />
  </div>

  <div class="grid gap-2">
    <label suiLabel id="disabled-color-label" for="disabled-color">Disabled color</label>
    <sui-color-picker id="disabled-color" disabled ariaLabelledby="disabled-color-label" [value]="'#6d28d9'" />
  </div>

  <div class="grid gap-2">
    <label suiLabel id="validated-color-label" for="validated-color">Validated hex color</label>
    <sui-color-picker
      id="validated-color"
      ariaLabelledby="validated-color-label"
      invalidMessage="Use a six-digit hex value such as #991b1b."
      [value]="'#991b1b'" />
  </div>

  <div class="grid gap-2">
    <label suiLabel id="invalid-color-label" for="invalid-color">Server-validated color</label>
    <sui-color-picker id="invalid-color" invalid ariaLabelledby="invalid-color-label" [value]="'#c2410c'" />
  </div>
</div>
