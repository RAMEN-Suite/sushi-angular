<div class="grid w-96 max-w-full gap-5">
  <div class="grid gap-2">
    <label id="toolbar-color-label" for="toolbar-color" class="font-medium">Compact toolbar color</label>
    <sui-color-picker
      id="toolbar-color"
      class="w-fit"
      ariaLabelledby="toolbar-color-label"
      [showInput]="false"
      [value]="'#15803d'" />
  </div>

  <div class="grid gap-2">
    <label id="disabled-color-label" for="disabled-color" class="font-medium">Disabled color</label>
    <sui-color-picker id="disabled-color" ariaLabelledby="disabled-color-label" disabled [value]="'#6d28d9'" />
  </div>

  <div class="grid gap-2">
    <label id="validated-color-label" for="validated-color" class="font-medium">Validated hex color</label>
    <sui-color-picker
      id="validated-color"
      ariaLabelledby="validated-color-label"
      invalidMessage="Use a six-digit hex value such as #991b1b."
      [value]="'#991b1b'" />
    <p class="text-sm text-base-content/60">Enter an incomplete value and leave the field to see validation.</p>
  </div>

  <div class="grid gap-2">
    <label id="server-color-label" for="server-color" class="font-medium">Server-validated color</label>
    <sui-color-picker
      id="server-color"
      ariaLabelledby="server-color-label"
      invalid
      ariaDescribedby="server-color-error"
      [value]="'#c2410c'" />
    <p id="server-color-error" class="text-error text-sm">This color is not available for the selected theme.</p>
  </div>
</div>
