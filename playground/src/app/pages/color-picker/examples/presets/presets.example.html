<div class="grid gap-6">
  <div class="grid gap-2">
    <label suiLabel id="preset-color-label" for="preset-color">Quick palette</label>
    <sui-color-picker
      id="preset-color"
      ariaLabelledby="preset-color-label"
      [presets]="colors"
      [value]="'#0369a1'"
      class="w-fit" />
  </div>

  <div class="grid gap-2">
    <label suiLabel id="palette-color-label" for="palette-color">Custom preset content</label>
    <sui-color-picker
      id="palette-color"
      ariaLabelledby="palette-color-label"
      [presets]="presets"
      [value]="'#334155'"
      class="w-fit">
      <ng-template suiColorPickerPreset let-color let-label="label" let-selected="selected">
        <span class="size-4 rounded-field border border-current/20" [style.background-color]="color"></span>
        {{ label }}
        @if (selected) {
          <svg lucideCheck class="size-4" aria-hidden="true"></svg>
        }
      </ng-template>
    </sui-color-picker>
  </div>
</div>
