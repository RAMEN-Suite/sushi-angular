<div class="grid w-96 max-w-full gap-4">
  <div class="grid gap-2">
    <label suiLabel id="brand-color-label" for="brand-color">Brand color</label>
    <sui-color-picker
      id="brand-color"
      fluid
      defaultValue="#0369a1"
      ariaLabelledby="brand-color-label"
      [formField]="form.color">
      <button suiButton suiJoinItem type="button" severity="neutral" variant="soft" (click)="reset()">Reset</button>
    </sui-color-picker>
    <p class="text-sm text-base-content/60">Enter a hex value or use the native color picker.</p>
  </div>

  <sui-card size="xs" class="w-fit">
    <div class="flex items-center gap-3">
      <span class="size-10 rounded-field border border-base-300" [style.background-color]="form.color().value()"></span>
      <span>
        <span class="block text-xs text-base-content/60">Selected color</span>
        <code class="font-mono uppercase">{{ form.color().value() }}</code>
      </span>
    </div>
  </sui-card>
</div>
