<div class="flex flex-wrap items-center gap-3">
  <button suiButton type="button" (click)="open.set(true)">Edit workspace</button>
  <span class="text-sm text-base-content/60">Last result: {{ result() }}</span>
</div>

<dialog
  suiDialog
  #workspaceDialog="suiDialog"
  aria-labelledby="workspace-dialog-title"
  [(open)]="open"
  (closed)="record($event)">
  <h2 id="workspace-dialog-title" class="text-lg font-semibold">Workspace details</h2>
  <div class="mt-5 grid gap-2">
    <label suiLabel for="workspace-name">Name</label>
    <input suiInput fluid id="workspace-name" value="Northstar" />
  </div>
  <div class="mt-6 flex justify-end gap-2">
    <button suiButton type="button" severity="neutral" variant="soft" [suiDialogClose]="workspaceDialog">Cancel</button>
    <button suiButton type="button" [suiDialogClose]="workspaceDialog" suiDialogCloseValue="saved">Save</button>
  </div>
</dialog>
