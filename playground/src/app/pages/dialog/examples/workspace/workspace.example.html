<button suiButton type="button" variant="outlined" [suiDialogTrigger]="workspaceDialog">Open movable dialog</button>

<dialog
  suiDialog
  #workspaceDialog="suiDialog"
  aria-labelledby="workspace-title"
  draggable
  resizable
  position="top"
  class="w-[min(36rem,calc(100vw-2rem))]">
  <sui-card class="flex h-full w-full min-w-0 flex-col">
    <div suiDialogDragHandle class="flex items-center gap-3">
      <svg lucideGripHorizontal class="size-4" aria-hidden="true"></svg>
      <h2 suiCardTitle id="workspace-title" class="flex-1">Workspace settings</h2>
      <button
        suiButton
        type="button"
        size="sm"
        severity="neutral"
        variant="text"
        aria-label="Toggle maximized dialog"
        (click)="workspaceDialog.toggleMaximize()">
        @if (workspaceDialog.maximized()) {
          <svg lucideMinimize2 class="size-4" aria-hidden="true"></svg>
        } @else {
          <svg lucideMaximize2 class="size-4" aria-hidden="true"></svg>
        }
      </button>
      <button
        suiButton
        type="button"
        size="sm"
        severity="neutral"
        variant="text"
        aria-label="Close dialog"
        [suiDialogClose]="workspaceDialog">
        <svg lucideX class="size-4" aria-hidden="true"></svg>
      </button>
    </div>
    <div suiDivider></div>
    <p class="min-h-28 flex-1 text-base-content/70">
      Drag from the header, resize from the lower corner, or maximize the dialog.
    </p>
    <div suiCardActions class="justify-end">
      <button suiButton type="button" [suiDialogClose]="workspaceDialog" suiDialogCloseValue="saved">
        Save changes
      </button>
    </div>
  </sui-card>
</dialog>
