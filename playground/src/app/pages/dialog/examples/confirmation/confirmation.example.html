<button suiButton type="button" [suiDialogTrigger]="archiveDialog">Archive project</button>

<dialog suiDialog #archiveDialog="suiDialog" aria-labelledby="archive-dialog-title">
  <h2 id="archive-dialog-title" class="text-lg font-semibold">Archive Atlas?</h2>
  <p class="mt-2 text-base-content/70">
    The project will leave active views. You can restore it later from the archive.
  </p>
  <div class="mt-6 flex justify-end gap-2">
    <button suiButton type="button" severity="neutral" variant="soft" [suiDialogClose]="archiveDialog">Cancel</button>
    <button suiButton type="button" severity="error" [suiDialogClose]="archiveDialog" suiDialogCloseValue="archive">
      Archive
    </button>
  </div>
</dialog>
