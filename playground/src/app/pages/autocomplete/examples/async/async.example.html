<div class="grid w-full max-w-sm gap-2">
  <label suiLabel for="remote-city" class="font-medium">Remote city search</label>
  <sui-autocomplete
    fluid
    id="remote-city"
    [delay]="300"
    [minQueryLength]="2"
    [options]="options()"
    [loading]="loading()"
    [errorMessage]="error()"
    placeholder="Type at least two letters"
    (queryChange)="search($event)">
    <ng-template suiAutocompleteLoading let-message>
      <span class="flex gap-2">
        <span suiSpinner size="sm"></span>
        {{ message }}
      </span>
    </ng-template>
    <ng-template suiAutocompleteEmpty let-query="query">No city matches “{{ query }}”.</ng-template>
    <ng-template suiAutocompleteError let-message>{{ message }}</ng-template>
  </sui-autocomplete>
</div>
