<div class="grid items-start gap-6 lg:grid-cols-2">
  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Sizes</legend>

    <div class="grid gap-3">
      @for (size of sizes; track size) {
        <div class="grid gap-2">
          <label suiLabel [attr.for]="'autocomplete-size-' + size">
            <span class="flex w-full items-center justify-between gap-3">
              {{ size.toUpperCase() }}
              <code suiBadge severity="neutral" variant="soft" size="xs" class="font-mono">size="{{ size }}"</code>
            </span>
          </label>
          <sui-autocomplete
            fluid
            [id]="'autocomplete-size-' + size"
            [size]="size"
            [options]="options"
            [placeholder]="size.toUpperCase() + ' destination'" />
        </div>
      }
    </div>
  </fieldset>

  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Interaction states</legend>

    <div class="grid gap-4">
      <div class="grid gap-2">
        <label suiLabel for="autocomplete-selected">Selected value</label>
        <sui-autocomplete fluid id="autocomplete-selected" [options]="options" value="berlin" />
      </div>

      <div class="grid gap-2">
        <label suiLabel for="autocomplete-loading">Loading suggestions</label>
        <sui-autocomplete
          fluid
          id="autocomplete-loading"
          loading
          [options]="options"
          placeholder="Finding destinations" />
      </div>

      <div class="grid gap-2">
        <label suiLabel for="autocomplete-disabled">Disabled</label>
        <sui-autocomplete fluid id="autocomplete-disabled" disabled [options]="options" placeholder="Unavailable" />
      </div>

      <div class="grid gap-2">
        <label suiLabel for="autocomplete-invalid">Invalid destination</label>
        <sui-autocomplete
          fluid
          required
          invalid
          touched
          id="autocomplete-invalid"
          [options]="options"
          placeholder="Choose a destination" />
      </div>
    </div>
  </fieldset>
</div>
