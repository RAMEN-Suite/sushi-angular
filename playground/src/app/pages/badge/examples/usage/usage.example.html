<div class="grid gap-7">
  <section class="grid gap-3">
    <h3 class="text-sm font-medium">Semantic colors</h3>
    <div class="flex flex-wrap items-center gap-2">
      @for (severity of severities; track severity) {
        <span suiBadge [severity]="severity">{{ severity }}</span>
      }
    </div>
  </section>

  <section class="grid gap-3">
    <h3 class="text-sm font-medium">Variants</h3>
    <div class="flex flex-wrap items-center gap-2">
      <span suiBadge>Solid</span>
      @for (variant of variants; track variant) {
        <span suiBadge [variant]="variant">{{ variant }}</span>
      }
    </div>
  </section>

  <section class="grid gap-3">
    <h3 class="text-sm font-medium">Sizes</h3>
    <div class="flex flex-wrap items-center gap-2">
      @for (size of sizes; track size) {
        <span suiBadge severity="neutral" variant="soft" [size]="size">{{ size }}</span>
      }
    </div>
  </section>
</div>
