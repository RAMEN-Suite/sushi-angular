<div class="grid max-w-xl gap-5">
  <div class="flex flex-wrap items-center gap-3">
    <button suiButton type="button" severity="neutral" variant="soft">
      Notifications
      <span suiBadge size="sm" severity="error">4</span>
    </button>
    <span suiBadge severity="neutral" variant="outlined">v2.4.0</span>
  </div>

  <sui-card size="sm">
    <sui-list [items]="environments" ariaLabel="Deployment environments">
      <ng-template suiListItem let-environment>
        <span class="list-col-grow">{{ environment.name }}</span>
        <span suiBadge size="sm" [severity]="environment.severity" variant="soft">{{ environment.state }}</span>
      </ng-template>
    </sui-list>
  </sui-card>
</div>
