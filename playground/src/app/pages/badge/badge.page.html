<main class="pg-page">
  <section class="pg-page__header">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Badge</h1>
      <p class="text-lg text-base-content/70">Display compact static metadata, counts, and states.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Badge architecture">
      <span suiBadge severity="neutral" variant="soft" size="sm">Directive</span>
    </div>
  </section>

  <section class="pg-page__section">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Colors, variants, and sizes</h2>
      <p class="text-base-content/60">Match semantic meaning and surrounding density without adding interaction.</p>
    </div>
    <pg-example-code [html]="examples.usage.html" [typescript]="examples.usage.typescript">
      <ng-template pgExamplePreview><pg-badge-usage-example /></ng-template>
    </pg-example-code>
  </section>

  <section class="pg-page__section">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Counts and states</h2>
      <p class="text-base-content/60">Support controls or summarize application state while the Badge remains static.</p>
    </div>
    <pg-example-code [html]="examples.context.html" [typescript]="examples.context.typescript">
      <ng-template pgExamplePreview><pg-badge-context-example /></ng-template>
    </pg-example-code>
  </section>
</main>
