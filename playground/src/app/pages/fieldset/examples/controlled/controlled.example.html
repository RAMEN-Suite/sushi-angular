<div class="grid w-full max-w-2xl gap-3">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <strong class="block">Checkout details</strong>
      <span class="text-sm text-base-content/60">The external action controls the fieldset below.</span>
    </div>
    <button suiButton type="button" severity="neutral" variant="soft" (click)="expanded.update((value) => !value)">
      {{ expanded() ? 'Hide address' : 'Edit address' }}
    </button>
  </div>

  <fieldset
    suiFieldset
    collapsible
    [(expanded)]="expanded"
    class="rounded-box border border-base-300 bg-base-100 px-5 pb-5">
    <legend suiFieldsetLegend><button suiFieldsetToggle>Billing address</button></legend>
    <div suiFieldsetContent class="grid gap-4 pt-1 sm:grid-cols-2">
      <label suiLabel class="grid gap-1.5 sm:col-span-2">
        <span class="text-sm">Street</span>
        <input suiInput fluid value="42 Example Street" />
      </label>
      <label suiLabel class="grid gap-1.5">
        <span class="text-sm">City</span>
        <input suiInput fluid value="London" />
      </label>
      <label suiLabel class="grid gap-1.5">
        <span class="text-sm">Postal code</span>
        <input suiInput fluid value="SW1A 1AA" />
      </label>
      <div class="flex flex-wrap justify-end gap-2 border-t border-base-300 pt-4 sm:col-span-2">
        <button suiButton type="button" severity="neutral" variant="soft">Cancel</button>
        <button suiButton type="button">Use this address</button>
      </div>
    </div>
  </fieldset>
</div>
