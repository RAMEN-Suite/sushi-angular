<div class="grid w-full max-w-2xl gap-5">
  <fieldset suiFieldset>
    <legend suiFieldsetLegend>Account notifications</legend>
    <div class="grid gap-3">
      <label suiLabel class="flex items-start gap-3">
        <input suiCheckbox type="checkbox" class="mt-0.5" checked />
        <span>
          <strong class="block">Product updates</strong>
          <span class="text-sm text-base-content/60">News about releases and improvements.</span>
        </span>
      </label>
      <label suiLabel class="flex items-start gap-3">
        <input suiCheckbox type="checkbox" class="mt-0.5" checked />
        <span>
          <strong class="block">Security alerts</strong>
          <span class="text-sm text-base-content/60">Important activity concerning your account.</span>
        </span>
      </label>
      <label suiLabel class="mt-1 grid gap-1.5">
        <span>Notification email</span>
        <input suiInput fluid type="email" value="hello@example.com" />
      </label>
    </div>
    <div suiDivider class="mt-4"></div>
    <div class="flex flex-wrap justify-end gap-2">
      <button suiButton type="button" severity="neutral" variant="soft">Cancel</button>
      <button suiButton type="button">Save preferences</button>
    </div>
  </fieldset>

  <fieldset suiFieldset disabled>
    <legend suiFieldsetLegend>Organization policy</legend>
    <label suiLabel class="grid gap-1.5">
      <span>Security reports</span>
      <input suiInput fluid value="Managed by your administrator" />
    </label>
  </fieldset>
</div>
