<main class="pg-page">
  <section class="pg-page__header">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Radio</h1>
      <p class="text-lg text-base-content/70">Choose one value from a visible native radio group.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Radio architecture">
      <span suiBadge severity="neutral" variant="soft" size="sm">Directive</span>
      <span suiBadge severity="neutral" variant="soft" size="sm">Native element</span>
      <span suiBadge severity="neutral" variant="soft" size="sm">Signal Forms</span>
    </div>
  </section>

  <section class="pg-page__section">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Group, appearance, and states</h2>
      <p class="text-base-content/60">
        Use a named native group or a shared Signal Forms field; disabled, invalid, size, and severity remain native-friendly.
      </p>
    </div>
    <pg-example-code [html]="example.html" [typescript]="example.typescript">
      <ng-template pgExamplePreview><pg-radio-usage-example /></ng-template>
    </pg-example-code>
  </section>
</main>
