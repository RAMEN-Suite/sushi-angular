<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Radio</h1>
      <p class="max-w-3xl text-lg text-base-content/70">Choose one value from a visible native radio group.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Radio architecture">
      <span suiBadge variant="soft" size="sm">Directive</span>
      <span suiBadge variant="soft" size="sm">Native element</span>
      <span suiBadge variant="soft" size="sm">Signal Forms</span>
    </div>
  </section>

  <sui-card
    ><h2 suiCardTitle>Group, appearance, and states</h2>
    <p class="text-base-content/60">
      Use a named native group or a shared Signal Forms field; disabled, invalid, size, and severity remain native-friendly.
    </p>
    <sui-card size="sm" class="mt-5 border border-base-300 bg-base-200/30 shadow-none"><pg-radio-usage-example /></sui-card>
    <div class="mt-6"><pg-example-code [html]="example.html" [typescript]="example.typescript" /></div
  ></sui-card>
</main>
