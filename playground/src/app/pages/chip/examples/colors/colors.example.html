<div class="grid gap-4">
  <div class="flex flex-wrap items-center gap-2">
    <sui-chip label="Primary" severity="primary" />
    <sui-chip label="Secondary" severity="secondary" />
    <sui-chip label="Accent" severity="accent" />
    <sui-chip label="Neutral" severity="neutral" />
    <sui-chip label="Info" severity="info" />
    <sui-chip label="Success" severity="success" />
    <sui-chip label="Warning" severity="warning" />
    <sui-chip label="Error" severity="error" />
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <sui-chip label="Outlined" severity="primary" variant="outlined" />
    <sui-chip label="Soft" severity="primary" variant="soft" />
    <sui-chip label="Dash" severity="primary" variant="dash" />
  </div>
