<sui-chip label="Custom content" removable>
  <ng-template suiChipContent let-label>
    <svg lucidePalette class="size-4" aria-hidden="true"></svg>
    <span class="font-semibold">{{ label }}</span>
  </ng-template>
  <ng-template suiChipRemoveIcon>
    <svg lucideCircleX class="size-3.5" aria-hidden="true"></svg>
  </ng-template>
</sui-chip>
