<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Divider</h1>
      <p class="text-lg text-base-content/70">Separate related content horizontally or vertically with an optional label.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Divider architecture"><span suiBadge variant="soft" size="sm">Directive</span></div>
  </section>
  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Sections and alternatives</h2>
      <p class="text-base-content/60">Separate neighboring sections or label a meaningful choice between two paths.</p>
    </div>
    <pg-example-code [html]="examples.usage.html" [typescript]="examples.usage.typescript"
      ><ng-template pgExamplePreview><pg-divider-usage-example /></ng-template
    ></pg-example-code>
  </section>
  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Placement and orientation</h2>
      <p class="text-base-content/60">Align a label along its line or divide adjacent regions vertically.</p>
    </div>
    <pg-example-code [html]="examples.layout.html" [typescript]="examples.layout.typescript"
      ><ng-template pgExamplePreview><pg-divider-layout-example /></ng-template
    ></pg-example-code>
  </section>
</main>
