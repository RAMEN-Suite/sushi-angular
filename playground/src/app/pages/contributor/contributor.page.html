<main class="mx-auto w-full min-w-0 max-w-7xl overflow-x-hidden px-4 py-8 sm:px-8 sm:py-12">
  <header class="mb-10 max-w-3xl space-y-3">
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-primary">Contribute</p>
    <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">{{ page.title }}</h1>
    <p class="text-lg leading-relaxed text-base-content/65">{{ page.description }}</p>
  </header>

  <pg-markdown-document [source]="page.source" (documentLink)="openDocument($event)" />

  @if (page.themeTokens) {
    <pg-theme-token-table class="mt-12 block" />
  }
</main>
