<sui-navbar
  [items]="items"
  [value]="activeDestination()"
  collapseAt="md"
  inset="comfortable"
  ariaLabel="Northstar website"
  (itemSelected)="activeDestination.set($event)">
  <span suiNavbarBrand class="inline-flex items-center gap-2.5 text-lg font-semibold">
    <svg class="size-8 text-primary" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path
        d="M16 3.5 27 9.8v12.4L16 28.5 5 22.2V9.8L16 3.5Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linejoin="round" />
      <path d="m5.8 10.2 10.2 6 10.2-6M16 16.2v11.2" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      <path d="m11 7 10.3 6.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".45" />
    </svg>
    Northstar
  </span>
</sui-navbar>
