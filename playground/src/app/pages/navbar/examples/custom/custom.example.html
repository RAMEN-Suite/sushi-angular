<div class="rounded-box bg-base-200/40 p-3 sm:p-4">
  <sui-navbar
    [items]="items"
    [value]="activePage()"
    variant="menu"
    ariaLabel="Operations console"
    (itemSelected)="activePage.set($event)">
    <span suiNavbarBrand class="inline-flex items-center gap-4 px-4 py-2 font-semibold">
      <span class="grid size-11 shrink-0 place-items-center rounded-field bg-secondary text-secondary-content">
        <svg lucideZap class="size-5" aria-hidden="true"></svg>
      </span>
      <span class="hidden sm:inline">Orbit</span>
      <span class="mx-1 hidden h-6 w-px bg-base-300 lg:block" aria-hidden="true"></span>
    </span>

    <ng-template [suiNavbarItem]="items" let-item>
      <span>{{ item.label }}</span>
      @if (item.badge) {
        <span suiBadge size="xs" variant="soft" class="ml-auto">{{ item.badge }}</span>
      }
    </ng-template>

    <button
      suiButton
      suiNavbarAction
      type="button"
      size="md"
      shape="square"
      severity="neutral"
      variant="text"
      class="ml-2"
      aria-label="Search">
      <svg lucideSearch class="size-4" aria-hidden="true"></svg>
    </button>
    <button
      suiButton
      suiNavbarAction
      type="button"
      size="md"
      shape="square"
      severity="neutral"
      variant="text"
      class="hidden lg:inline-flex"
      aria-label="Notifications">
      <svg lucideBell class="size-4" aria-hidden="true"></svg>
    </button>
    <button suiButton suiNavbarAction type="button" size="md" class="hidden lg:inline-flex">
      <svg lucidePlus class="size-4" aria-hidden="true"></svg>
      New task
    </button>
  </sui-navbar>

  <div class="mt-3 flex flex-wrap items-center justify-between gap-2 px-2 text-sm text-base-content/60">
    <span>12 tasks across 3 active projects</span>
    <span class="inline-flex items-center gap-2">
      <span class="size-2 rounded-full bg-success" aria-hidden="true"></span>
      All systems operational
    </span>
  </div>
</div>
