<div class="p-3 sm:p-4">
  <sui-navbar
    [items]="items"
    [value]="activePage()"
    collapseAt="md"
    menuAlign="center"
    variant="menu"
    ariaLabel="Operations console"
    (itemSelected)="activePage.set($event)">
    <span suiNavbarBrand class="inline-flex items-center gap-4 font-semibold">
      <span class="grid size-11 shrink-0 place-items-center rounded-field bg-secondary text-secondary-content">
        <svg lucideZap class="size-5" aria-hidden="true"></svg>
      </span>
      <span class="hidden sm:inline">Orbit</span>
      <span suiDivider orientation="vertical" class="mx-1 hidden h-6 min-h-6 lg:flex" aria-hidden="true"></span>
    </span>

    <ng-template [suiNavbarItem]="items" let-item>
      <span>{{ item.label }}</span>
      @if (item.badge) {
        <span suiBadge size="xs" variant="soft" class="ml-auto">{{ item.badge }}</span>
      }
    </ng-template>

    <button
      suiButton
      suiNavbarAction
      type="button"
      size="md"
      shape="square"
      severity="neutral"
      variant="text"
      class="ml-2"
      aria-label="Search">
      <svg lucideSearch class="size-4" aria-hidden="true"></svg>
    </button>
    <button
      suiButton
      suiNavbarAction
      type="button"
      size="md"
      shape="square"
      severity="neutral"
      variant="text"
      aria-label="Notifications">
      <svg lucideBell class="size-4" aria-hidden="true"></svg>
    </button>
    <button suiButton suiNavbarAction type="button" size="md" aria-label="New task">
      <svg lucidePlus class="size-4" aria-hidden="true"></svg>
      <span class="hidden lg:inline">New task</span>
    </button>
  </sui-navbar>

  <div class="mt-3 flex flex-wrap items-center justify-between gap-2 px-2 text-sm text-base-content/60">
    <span>12 tasks across 3 active projects</span>
    <span class="inline-flex items-center gap-2">
      <span suiStatus severity="success" size="sm" aria-hidden="true"></span>
      All systems operational
    </span>
  </div>
</div>
