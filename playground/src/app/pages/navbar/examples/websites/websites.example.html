<sui-navbar [collapsible]="false" ariaLabel="Arcwell workspace">
  <span suiNavbarBrand class="inline-flex items-center gap-3 px-1.5">
    <span class="grid size-9 place-items-center rounded-field bg-primary text-primary-content">
      <svg lucideSparkles class="size-5" aria-hidden="true"></svg>
    </span>
    <span>
      <strong class="block leading-tight">Arcwell</strong>
      <span class="block text-xs leading-tight text-base-content/50">Team workspace</span>
    </span>
  </span>

  <div suiNavbarContent class="workspace-search">
    <div suiInputSurface size="sm" fluid>
      <svg lucideSearch class="size-4 text-base-content/40" aria-hidden="true"></svg>
      <input
        suiInputSurfaceControl
        type="search"
        placeholder="Search projects and people"
        aria-label="Search workspace" />
      <kbd suiKbd size="sm">⌘ K</kbd>
    </div>
  </div>

  <button
    suiButton
    suiNavbarAction
    type="button"
    size="sm"
    shape="square"
    severity="neutral"
    variant="text"
    aria-label="Notifications">
    <svg lucideBell class="size-4" aria-hidden="true"></svg>
  </button>
  <button
    suiButton
    suiNavbarAction
    type="button"
    size="sm"
    shape="square"
    severity="neutral"
    variant="text"
    class="hidden sm:inline-flex"
    aria-label="Help">
    <svg lucideCircleQuestionMark class="size-4" aria-hidden="true"></svg>
  </button>
  <button suiButton suiNavbarAction type="button" size="sm" shape="square" aria-label="Create project">
    <svg lucidePlus class="size-4" aria-hidden="true"></svg>
  </button>
</sui-navbar>
