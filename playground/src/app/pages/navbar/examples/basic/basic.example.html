<div class="grid gap-5">
  <section class="grid gap-2">
    <span class="text-xs font-semibold tracking-wide text-(--sui-color-subtle) uppercase">Link navigation</span>
    <sui-navbar [items]="items" [value]="activePage()" inset="comfortable" (itemSelected)="activePage.set($event)">
      <span suiNavbarBrand class="inline-flex items-center gap-2.5 text-lg font-semibold">
        <svg lucideSoup class="size-5 text-primary" aria-hidden="true"></svg>
        Ramen
      </span>
    </sui-navbar>
  </section>

  <section class="grid gap-2">
    <span class="text-xs font-semibold tracking-wide text-(--sui-color-subtle) uppercase">Button navigation</span>
    <sui-navbar
      [items]="items"
      [value]="activePage()"
      inset="comfortable"
      variant="menu"
      (itemSelected)="activePage.set($event)">
      <span suiNavbarBrand class="inline-flex items-center gap-2.5 text-lg font-semibold">
        <svg lucideSoup class="size-5 text-primary" aria-hidden="true"></svg>
        Ramen
      </span>
    </sui-navbar>
  </section>
</div>
