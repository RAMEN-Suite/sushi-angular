<main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-8 sm:py-10">
  <section class="grid gap-4 py-2">
    <div class="space-y-3">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Keyboard Key</h1>
      <p class="text-lg text-base-content/70">Display individual keys and keyboard shortcuts with native semantics.</p>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Keyboard Key architecture">
      <span suiBadge variant="soft" size="sm">Directive</span><span suiBadge variant="soft" size="sm">Native element</span>
    </div>
  </section>
  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Keys and sizes</h2>
      <p class="text-base-content/60">Compose shortcuts from semantic key elements and match surrounding density.</p>
    </div>
    <pg-example-code [html]="examples.usage.html" [typescript]="examples.usage.typescript"
      ><ng-template pgExamplePreview><pg-kbd-usage-example /></ng-template
    ></pg-example-code>
  </section>
  <section class="space-y-6">
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Shortcut reference</h2>
      <p class="text-base-content/60">Keep command names and corresponding keys easy to scan.</p>
    </div>
    <pg-example-code [html]="examples.hotkeys.html" [typescript]="examples.hotkeys.typescript"
      ><ng-template pgExamplePreview><pg-kbd-hotkeys-example /></ng-template
    ></pg-example-code>
  </section>
</main>
