<sui-card size="sm" class="w-full max-w-lg">
  <div class="flex items-center gap-3">
    <svg lucideCommand class="size-5 text-(--sui-color-muted)" aria-hidden="true"></svg>
    <div>
      <h3 suiCardTitle>Keyboard shortcuts</h3>
      <p class="text-sm text-(--sui-color-muted)">Navigate the workspace without leaving the keyboard.</p>
    </div>
  </div>
  <div suiDivider class="my-0.5"></div>

  <sui-list rowHover size="sm" [items]="shortcuts" ariaLabel="Keyboard shortcuts">
    <ng-template [suiListItem]="shortcuts" let-shortcut>
      <span class="list-col-grow">{{ shortcut.label }}</span>
      <span class="flex items-center gap-1">
        @for (key of shortcut.keys; track key) {
          <kbd suiKbd size="sm">{{ key }}</kbd>
        }
      </span>
    </ng-template>
  </sui-list>
</sui-card>
