<sui-card size="sm" class="w-full max-w-lg">
  <div class="flex items-center gap-3">
    <svg lucideCommand class="size-5 text-base-content/60" aria-hidden="true"></svg>
    <div>
      <h3 suiCardTitle>Keyboard shortcuts</h3>
      <p class="text-sm text-base-content/60">Navigate the workspace without leaving the keyboard.</p>
    </div>
  </div>
  <div suiDivider></div>

  <dl class="grid gap-1">
    @for (shortcut of shortcuts; track shortcut.label) {
      <div class="flex items-center justify-between gap-4 rounded-field px-3 py-2 hover:bg-base-200">
        <dt>{{ shortcut.label }}</dt>
        <dd class="flex items-center gap-1">
          @for (key of shortcut.keys; track key) {
            <kbd suiKbd size="sm">{{ key }}</kbd>
          }
        </dd>
      </div>
    }
  </dl>
</sui-card>
