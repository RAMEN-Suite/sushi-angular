<div class="grid gap-4 sm:grid-cols-2">
  <div class="space-y-2">
    <img
      suiLightbox
      wheelToZoom
      description="Use the mouse wheel or pinch gesture to inspect details."
      class="aspect-[3/2] w-full rounded-box object-cover"
      src="/sushi-gallery-salmon.jpg"
      alt="Salmon sushi served with ginger and wasabi" />
    <p class="text-sm font-medium">Zoomable detail</p>
  </div>
  <div class="space-y-2">
    <img
      suiLightbox
      [zoom]="false"
      description="A focused image without zoom controls."
      class="aspect-[3/2] w-full rounded-box object-cover"
      src="/sushi-gallery-nigiri.jpg"
      alt="Nigiri arranged on a ceramic plate" />
    <p class="text-sm font-medium">Focused view</p>
  </div>
</div>
