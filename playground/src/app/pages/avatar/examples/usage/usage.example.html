<div class="grid gap-8">
  <section class="grid gap-3">
    <h3 class="text-sm font-medium">Sizes</h3>
    <div class="flex flex-wrap items-end gap-4">
      @for (size of sizes; track size) {
        <sui-avatar [size]="size"><img src="sample-avatar.svg" [alt]="size + ' profile'" /></sui-avatar>
      }
    </div>
  </section>

  <section class="grid gap-3">
    <h3 class="text-sm font-medium">Shapes and masks</h3>
    <div class="flex flex-wrap items-center gap-5">
      @for (shape of shapes; track shape) {
        <sui-avatar size="lg" [shape]="shape"><img src="sample-avatar.svg" [alt]="shape + ' profile'" /></sui-avatar>
      }
    </div>
  </section>

  <section class="grid gap-3">
    <h3 class="text-sm font-medium">Partial masks</h3>
    <div class="flex items-center gap-4">
      <sui-avatar size="lg" shape="heart" maskHalf="first">
        <img src="sample-avatar.svg" alt="First half of a masked profile" />
      </sui-avatar>
      <sui-avatar size="lg" shape="heart" maskHalf="second">
        <img src="sample-avatar.svg" alt="Second half of a masked profile" />
      </sui-avatar>
    </div>
  </section>
</div>
