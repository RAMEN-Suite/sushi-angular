<fieldset suiFieldset class="max-w-xl">
  <legend suiFieldsetLegend>Sizes</legend>
  <div class="grid min-w-0 gap-4">
    @for (size of sizes; track size) {
      <div class="grid min-w-0 gap-1.5">
        <label suiLabel [id]="'input-otp-size-' + size + '-label'" [attr.for]="'input-otp-size-' + size">
          <span class="flex items-center justify-between gap-3">
            {{ size.toUpperCase() }}
            <code suiBadge severity="neutral" variant="soft" size="xs" class="font-mono">size="{{ size }}"</code>
          </span>
        </label>
        <sui-input-otp
          [id]="'input-otp-size-' + size"
          [ariaLabelledby]="'input-otp-size-' + size + '-label'"
          [size]="size"
          [length]="4" />
      </div>
    }

    <div class="grid min-w-0 gap-1.5">
      <label suiLabel id="input-otp-eight-label" for="input-otp-eight">
        <span class="flex items-center justify-between gap-3">
          Eight-digit code
          <code suiBadge severity="neutral" variant="soft" size="xs" class="font-mono">length="8"</code>
        </span>
      </label>
      <sui-input-otp id="input-otp-eight" size="sm" ariaLabelledby="input-otp-eight-label" [length]="8" />
    </div>
  </div>
</fieldset>
