<div class="grid min-w-0 gap-6">
  <div class="grid min-w-0 gap-2">
    <label suiLabel id="input-otp-invalid-label" for="input-otp-invalid">Invalid code</label>
    <sui-input-otp
      id="input-otp-invalid"
      ariaLabelledby="input-otp-invalid-label"
      ariaDescribedby="input-otp-error"
      [length]="4"
      invalid
      [value]="'1234'" />
    <p id="input-otp-error" class="text-sm text-error">The code has expired.</p>
  </div>

  <div class="grid min-w-0 gap-2">
    <label suiLabel id="input-otp-disabled-label" for="input-otp-disabled">Disabled code</label>
    <sui-input-otp
      id="input-otp-disabled"
      ariaLabelledby="input-otp-disabled-label"
      [length]="4"
      disabled
      [value]="'2468'" />
  </div>
</div>
