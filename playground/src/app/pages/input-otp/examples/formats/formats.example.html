<div class="grid min-w-0 gap-4 sm:grid-cols-2">
  <sui-card size="sm" class="min-w-0 border border-base-300 bg-base-100 shadow-none">
    <label suiLabel id="input-otp-pin-label" for="input-otp-pin">Masked PIN</label>
    <sui-input-otp
      id="input-otp-pin"
      class="mt-2 block"
      ariaLabelledby="input-otp-pin-label"
      [length]="4"
      masked
      joined />
    <p class="mt-2 text-sm text-base-content/60">Numeric characters only.</p>
  </sui-card>

  <sui-card size="sm" class="min-w-0 border border-base-300 bg-base-100 shadow-none">
    <label suiLabel id="input-otp-account-label" for="input-otp-account">Alphanumeric code</label>
    <sui-input-otp
      id="input-otp-account"
      class="mt-2 block"
      ariaLabelledby="input-otp-account-label"
      [length]="4"
      [numeric]="false"
      [value]="'AB12'" />
    <p class="mt-2 text-sm text-base-content/60">Letters and numbers are accepted.</p>
  </sui-card>
</div>
